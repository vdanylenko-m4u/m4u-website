              </Scatter>
            </ScatterChart>
          </ResponsiveContainer>
        </div>
        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))', gap:12, marginTop:14}}>
          <div style={{background:CARD, border:'1px solid '+BRD, borderRadius:12, padding:'12px 16px', fontSize:12.5, lineHeight:1.55, color:'#bcc'}}>
            <b style={{color:GREEN}}>Ценообразование частично отражает спрос.</b> Standard — самая дефицитная категория (75% продано) и самая дорогая среди номеров (€6 937/м², премия +27,5% к ценам сделок).
          </div>
          <div style={{background:CARD, border:'1px solid '+RED+'44', borderRadius:12, padding:'12px 16px', fontSize:12.5, lineHeight:1.55, color:'#bcc'}}>
            <b style={{color:RED}}>Аномалия — Superior.</b> 23 юнита, ноль продаж, но цена €6 543/м² — выше Junior Suite (28% продано) и почти на уровне Suite (36%). Это €6,4 млн — 29% стоимости остатка без подтверждённого спроса.
          </div>
          <div style={{background:CARD, border:'1px solid '+BRD, borderRadius:12, padding:'12px 16px', fontSize:12.5, lineHeight:1.55, color:'#bcc'}}>
            <b style={{color:GOLD}}>Вывод.</b> Ускоренно повышать Standard и виллы 1-й линии, сдержанно — Junior Suite/Suite, Superior — заморозить или активировать спрос. Это основа сценариев S3/S4.
          </div>
        </div>
      </Sec>

      <Sec num="04" title="Четыре сценария выхода на таргет (матрица 2×2)">
        <div style={{fontSize:13, color:'#aab', marginBottom:14, maxWidth:960, lineHeight:1.55}}>
          Развилка 1 — стартовая структура: текущий прайс 2607 или разовый <b style={{color:TXT}}>ребейс</b> (разовое изменение цен по текущему уровню спроса — смена ценовой базы для дальнейшего планомерного роста; якорь Superior, коридор категорийных средних ≤15%). Развилка 2 — рост равномерный или взвешенный на спрос. Все сценарии дают ровно €24,65 млн с остатка; терминальный прирост = 2 × средний (ступенчатое удорожание после каждой продажи).
        </div>
        <ScenarioBlock/>
      </Sec>

      <Sec num="05" title="Сравнение сценариев">
        <div style={{overflowX:'auto'}}>
        <table style={{width:'100%', borderCollapse:'collapse', fontSize:12.5, fontVariantNumeric:'tabular-nums'}}>
          <thead><tr style={{color:'#889', textAlign:'left', fontSize:10.5, textTransform:'uppercase', letterSpacing:1}}>
            <th style={{padding:'8px 10px', borderBottom:'1px solid '+BRD}}>Показатель</th>
            {['S1','S2','S3','S4'].map(s=><th key={s} style={{padding:'8px 10px', borderBottom:'1px solid '+BRD, color: s==='S3'? GOLD:'#889'}}>{s}{s==='S3'? ' ★':''}</th>)}
          </tr></thead>
          <tbody>{DATA.compare.map((r,i)=>(
            <tr key={i} style={{borderBottom:'1px solid rgba(255,255,255,0.04)'}}>
              <td style={{padding:'9px 10px', color:'#aab'}}>{r.k}</td>
              {r.v.map((v,j)=><td key={j} style={{padding:'9px 10px', color: j===2? TXT:'#99a', fontWeight: j===2? 600:400}}>{v}</td>)}
            </tr>))}
          </tbody>
        </table>
        </div>
        <div style={{background:'rgba(251,191,36,0.06)', border:'1px solid '+GOLD+'44', borderRadius:12, padding:'14px 18px', marginTop:16, fontSize:13, lineHeight:1.6, color:'#ccd', maxWidth:960}}>
          <b style={{color:GOLD}}>Рекомендация: S3 как базовый, с триггером перехода в S4.</b> Ребейс даёт рыночно честную стартовую иерархию и самую компактную сетку, мягкая равномерная эскалация не создаёт ценовых шоков, финальные цены вилл — самые умеренные. Триггер: первые продажи Superior в течение 2–3 месяцев → перевод категории на взвешенную траекторию (логика S4) с перераспределением темпа в пользу лидеров спроса.
        </div>
      </Sec>

      <Sec num="06" title="Маржинальность (чистая маржа по методологии файла: BE/AW)">
        <div style={{fontSize:13, color:'#aab', marginBottom:10, maxWidth:960, lineHeight:1.55}}>
          Методология файла «cost per unit»: полная себестоимость AT ($27,98 млн) → маржа AX → минус расходы на реализацию (комиссии 10,13% + маркетинг 3,73% + финансовые 1,43% + налог 0,42% + курсовые 0,17% = 15,88% выручки) → чистая прибыль BE; маржинальность = BE/AW, курс модели 1,14. Внесены две корректировки: себестоимость No.723 нормализована до Suite-уровня ($301,9 тыс. вместо строки-накопителя $1,85 млн), высвобожденный остаток $1,55 млн разнесён на 15 вилл (~$103 тыс./вилла — в файле AT вилл = 0, отсюда искажённые 99,6% net). Суммарная себестоимость сохранена. Проект: net 25,5% сейчас → 28,4% при выполнении плана. Виллы — прибыльный двигатель (net 64–70%, втрое выше номеров); по логике аллокации файла общая инфраструктура сидит на отеле, виллы несут только собственный конструктив.
        </div>
        <div style={{height:300}}>
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={margData} margin={{top:8, right:14, bottom:4, left:0}}>
              <CartesianGrid stroke="rgba(255,255,255,0.05)" vertical={false}/>
              <XAxis dataKey="cat" tick={{fill:'#778', fontSize:10.5}} interval={0}/>
              <YAxis domain={[0,90]} tick={{fill:'#778', fontSize:11}} tickFormatter={v=>v+'%'}/>
              <Tooltip contentStyle={TTStyle} labelStyle={{color:GOLD, fontWeight:700}} itemStyle={{color:TXT, fontSize:12}} formatter={v=>v==null?'—':v.toFixed(1)+'% net'}/>
              <Bar dataKey="sold" name="Проданные (факт)" fill="#889" maxBarSize={20} radius={[3,3,0,0]}/>
              <Bar dataKey="now" name="Остаток, текущие цены" fill={BLUE} maxBarSize={20} radius={[3,3,0,0]}/>
              <Bar dataKey="after" name="Остаток после роста" fill={GOLD} maxBarSize={20} radius={[3,3,0,0]}/>
            </BarChart>
          </ResponsiveContainer>
        </div>
        <div style={{display:'flex', gap:16, fontSize:11, color:'#889'}}>
          <span><span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:'#889',marginRight:5}}/>проданные (факт)</span>
          <span><span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:BLUE,marginRight:5}}/>остаток, текущие цены</span>
          <span><span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:GOLD,marginRight:5}}/>остаток после роста</span>
        </div>
      </Sec>

      <Sec num="07" title="Данные и допущения">
        <ul style={{fontSize:12.5, color:'#aab', lineHeight:1.7, margin:0, paddingLeft:18, maxWidth:960}}>
          <li>Факт продаж — «ШАХМАТКА НОВАЯ 2607», колонка PRICE (sold + booked). Сверка с «cost per unit» (AU): все 81 общих юнита совпадают до евро.</li>
          <li>Расхождение полных сумм листов (€528 995) объясняется дефектами cost-листа: No.722 числится Sold за €360 905 (цена сделки соседнего No.723 — вероятная ошибка копирования; в шахматке 2607 юнит available за €299 900) и отсутствием виллы №15. Статус No.722 требует верификации: если продан — необходимый прирост снижается до +9,70%.</li>
          <li>Курс EUR/USD 1,145 (рынок 29–30.07.2026); в финмодели файла — 1,14 (при нём прирост +10,77%).</li>
          <li>Букинг приравнен к факту; коммерция — константа €149 900/юнит, план 10 юнитов. Категорийные маржи в самом cost-листе искажены (виллы 99,6% при AT = 0, Suite −15,5% из-за строки No.723) — в отчёте скорректированные значения.</li>
          <li>Рабочие файлы: maldives_target_scenarios(_ru).xlsx — полотовые расчёты с изменяемыми параметрами; пояснительная записка (UA/RU) — методология.</li>
        </ul>
      </Sec>

      <div style={{marginTop:40, paddingTop:16, borderTop:'1px solid '+BRD, fontSize:11, color:'#667', display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:8}}>
        <span>M4U · Maxify Price Analytics</span><span>Подготовлено {M.date}</span>
      </div>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Report/>);

</script>

<div id="gate" style="position:fixed;inset:0;background:#0f0f1a;display:flex;align-items:center;justify-content:center;z-index:999;font-family:'DM Sans','Segoe UI',sans-serif;">
  <div style="width:340px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:34px 30px;text-align:center;">
    <div style="font-size:11px;letter-spacing:3px;color:#fbbf24;font-weight:700;">M4U · PRICE ANALYTICS</div>
    <div style="font-size:17px;font-weight:700;color:#e2e8f0;margin:10px 0 4px;">Teus Radisson Maldives</div>
    <div style="font-size:12px;color:#778;margin-bottom:22px;">Отчёт защищён. Введите пароль доступа.</div>
    <input id="pw" type="password" placeholder="Пароль" autocomplete="off" style="width:100%;box-sizing:border-box;background:#0f0f1a;border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:11px 14px;color:#e2e8f0;font-size:14px;font-family:inherit;outline:none;" />
    <div id="pwerr" style="font-size:11.5px;color:#ef4444;height:16px;margin-top:8px;"></div>
    <button id="pwbtn" style="width:100%;margin-top:6px;background:rgba(251,191,36,0.14);border:1px solid #fbbf24;border-radius:10px;padding:11px;color:#fbbf24;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">Войти</button>
  </div>
</div>
<script>
(function(){
  var HASH = 23759216;
  function djb2(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}return h;}
  function boot(){
    var g=document.getElementById('gate'); if(g) g.remove();
    var code=document.getElementById('app-source').textContent;
    var out=Babel.transform(code,{presets:[['react',{runtime:'classic'}]]}).code;
    (new Function('React','ReactDOM','Recharts',out))(React,ReactDOM,Recharts);
  }
  function tryPw(){
    var v=document.getElementById('pw').value;
    if(djb2(v)===HASH){ sessionStorage.setItem('m4u_mald_auth','ok'); boot(); }
    else { document.getElementById('pwerr').textContent='Неверный пароль'; }
  }
  window.addEventListener('DOMContentLoaded', function(){
    if(sessionStorage.getItem('m4u_mald_auth')==='ok'){ boot(); return; }
    document.getElementById('pwbtn').addEventListener('click', tryPw);
    document.getElementById('pw').addEventListener('keydown', function(e){ if(e.key==='Enter') tryPw(); });
    document.getElementById('pw').focus();
  });
})();
</script>
