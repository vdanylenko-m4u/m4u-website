const fmtM2 = (v) => v == null ? "—" : "$" + Math.round(v).toLocaleString("uk-UA");
const fmtTotal = (v) => v == null ? "—" : "$" + Math.round(v).toLocaleString("uk-UA");
const fmtK = (v) => { if (v == null) return "—"; if (v >= 1e6) return "$" + (v / 1e6).toFixed(2) + "M"; if (v >= 1e3) return "$" + (v / 1e3).toFixed(0) + "K"; return "$" + Math.round(v); };

const calcStats = (arr) => {
  if (!arr.length) return { n: 0, min: 0, max: 0, mean: 0, std: 0, q1: 0, q3: 0, median: 0, iqr: 0 };
  const s = [...arr].sort((a, b) => a - b), n = s.length;
  const mean = s.reduce((a, b) => a + b, 0) / n;
  const std = Math.sqrt(s.reduce((a, v) => a + (v - mean) ** 2, 0) / n);
  const q = (p) => { const i = p * (n - 1), lo = Math.floor(i); return s[lo] + (s[Math.min(Math.ceil(i), n - 1)] - s[lo]) * (i - lo); };
  return { n, min: s[0], max: s[n - 1], mean, std, q1: q(0.25), q3: q(0.75), median: q(0.5), iqr: q(0.75) - q(0.25) };
};

const buildHistogram = (values, nBins = 10) => {
  if (values.length < 5) return [];
  const s = [...values].sort((a, b) => a - b);
  const vMin = s[0], vMax = s[s.length - 1];
  const binW = (vMax - vMin) / nBins;
  if (binW === 0) return [];
  return Array.from({ length: nBins }, (_, i) => {
    const lo = vMin + i * binW, hi = lo + binW;
    const count = i < nBins - 1 ? s.filter(v => v >= lo && v < hi).length : s.filter(v => v >= lo && v <= hi).length;
    return { x: Math.round((lo + hi) / 2), count, lo: Math.round(lo), hi: Math.round(hi) };
  });
};

const heatColor = (value, min, max) => {
  if (value == null || max === min) return "#3b82f6";
  const t = Math.max(0, Math.min(1, (value - min) / (max - min)));
  if (t <= 0.5) { const p = t * 2; return `rgb(${lerp(59, 251, p)},${lerp(130, 191, p)},${lerp(246, 36, p)})`; }
  const p = (t - 0.5) * 2; return `rgb(${lerp(251, 239, p)},${lerp(191, 68, p)},${lerp(36, 68, p)})`;
};

// ---- Box-plot ----
const RangeChart = ({ title, groups, metric, preserveOrder }) => {
  const [hover, setHover] = useState(null);
  const rows = useMemo(() => {
    const r = groups.map(g => ({ ...g, stats: calcStats(g.values) })).filter(g => g.stats.n > 0);
    if (!preserveOrder) r.sort((a, b) => a.stats.median - b.stats.median);
    return r;
  }, [groups, preserveOrder]);
  if (!rows.length) return null;
  const gMin = Math.min(...rows.map(r => r.stats.min));
  const gMax = Math.max(...rows.map(r => r.stats.max));
  const span = gMax - gMin || 1;
  const X = (v) => ((v - gMin) / span) * 100;
  const fmt = metric === "priceM2" ? fmtM2 : fmtK;
  return (
    <div style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.05)", borderRadius: 14, padding: "20px 24px", marginBottom: 16 }}>
      <div style={{ fontSize: 13, fontWeight: 700, color: "#aaa", textTransform: "uppercase", letterSpacing: 1.5, marginBottom: 18 }}>{title}</div>
      {rows.map((r, i) => (
        <div key={r.label} style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10, position: "relative" }}
          onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}>
          <div style={{ width: 92, fontSize: 12.5, color: "#bbb", fontWeight: 600, textAlign: "right", flexShrink: 0 }}>
            {r.label} <span style={{ color: "#666", fontWeight: 400 }}>({r.stats.n})</span>
          </div>
          <div style={{ flex: 1, height: 26, position: "relative" }}>
            <div style={{ position: "absolute", top: 12, left: `${X(r.stats.min)}%`, width: `${X(r.stats.max) - X(r.stats.min)}%`, height: 2, background: "rgba(255,255,255,0.18)" }} />
            <div style={{ position: "absolute", top: 7, left: `${X(r.stats.min)}%`, width: 2, height: 12, background: "rgba(255,255,255,0.35)" }} />
            <div style={{ position: "absolute", top: 7, left: `${X(r.stats.max)}%`, width: 2, height: 12, background: "rgba(255,255,255,0.35)" }} />
            <div style={{ position: "absolute", top: 3, left: `${X(r.stats.q1)}%`, width: `${Math.max(X(r.stats.q3) - X(r.stats.q1), 0.5)}%`, height: 20, background: `${r.color || GOLD}30`, border: `1px solid ${r.color || GOLD}70`, borderRadius: 4 }} />
            <div style={{ position: "absolute", top: 3, left: `${X(r.stats.median)}%`, width: 2, height: 20, background: r.color || GOLD }} />
            <div style={{ position: "absolute", top: 8, left: `calc(${X(r.stats.mean)}% - 5px)`, width: 10, height: 10, borderRadius: "50%", background: "#fff", border: "2px solid #0f0f1a" }} />
            {hover === i && (
              <div style={{ position: "absolute", bottom: 30, left: `${Math.min(Math.max(X(r.stats.median), 15), 75)}%`, transform: "translateX(-50%)", background: "#1a1a2e", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 10, padding: "10px 14px", fontSize: 12, color: "#ccc", whiteSpace: "nowrap", zIndex: 10, lineHeight: 1.7, boxShadow: "0 6px 24px rgba(0,0,0,0.5)" }}>
                <div style={{ color: "#fff", fontWeight: 700 }}>{r.label}</div>
                <div>min {fmt(r.stats.min)} · Q1 {fmt(r.stats.q1)}</div>
                <div>медіана <b style={{ color: r.color || GOLD }}>{fmt(r.stats.median)}</b> · середня {fmt(r.stats.mean)}</div>
                <div>Q3 {fmt(r.stats.q3)} · max {fmt(r.stats.max)}</div>
                <div style={{ color: "#888" }}>IQR {fmt(r.stats.iqr)} · σ {fmt(r.stats.std)}</div>
              </div>
            )}
          </div>
          <div style={{ width: 150, fontSize: 12, color: "#888", fontVariantNumeric: "tabular-nums", flexShrink: 0 }}>{fmt(r.stats.min)} – {fmt(r.stats.max)}</div>
        </div>
      ))}
    </div>
  );
};

// ---- Chessboard ----
const ChessBoard = ({ title, data, metric }) => {
  const vals = data.map(d => d[metric]).filter(v => v != null && !Number.isNaN(v));
  if (!vals.length) return null;
  const vMin = Math.min(...vals), vMax = Math.max(...vals), vMid = (vMin + vMax) / 2;
  const floorsAsc = [...new Set(data.map(d => d.floor))].sort((a, b) => a - b);
  const maxPos = Math.max(...data.map(d => d.unit));
  const positions = Array.from({ length: maxPos }, (_, i) => i + 1);
  const byKey = {};
  data.forEach(d => { byKey[`${d.floor}_${d.unit}`] = d; });
  const floorsDesc = [...floorsAsc].reverse();
  const fmt = metric === "priceM2" ? fmtM2 : fmtK;
  return (
    <div style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.05)", borderRadius: 14, padding: "22px 24px", marginBottom: 16 }}>
      <div style={{ fontSize: 13, fontWeight: 700, color: "#aaa", textTransform: "uppercase", letterSpacing: 1.5, marginBottom: 16 }}>{title} <span style={{ color: "#666", fontWeight: 400 }}>({data.length} кв.)</span></div>
      <div style={{ overflowX: "auto" }}>
        <div style={{ display: "grid", gridTemplateColumns: `44px repeat(${positions.length}, minmax(84px, 1fr))`, gap: 5, minWidth: 44 + positions.length * 90 }}>
          {floorsDesc.map(fl => (
            [<div key={`f${fl}`} style={{ display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, color: "#777", fontWeight: 700 }}>{fl}</div>,
            ...positions.map(pos => {
              const d = byKey[`${fl}_${pos}`];
              if (!d) return <div key={`${fl}_${pos}`} style={{ borderRadius: 8, minHeight: 58, background: "rgba(255,255,255,0.015)" }} />;
              const v = d[metric];
              const bg = heatColor(v, vMin, vMax);
              return (
                <div key={`${fl}_${pos}`} title={`№${d.number} · ${d.layout} · ${d.view}`} style={{ borderRadius: 8, minHeight: 58, background: bg, padding: "6px 8px", display: "flex", flexDirection: "column", justifyContent: "space-between", color: "#0f0f1a", cursor: "default" }}>
                  <div style={{ fontSize: 10, fontWeight: 700, opacity: 0.75 }}>№{d.number}</div>
                  <div style={{ fontSize: 13, fontWeight: 800, textAlign: "center" }}>{fmt(v)}</div>
                  <div style={{ fontSize: 10, fontWeight: 600, opacity: 0.75 }}>{d.rooms}к · {d.area}м²</div>
                </div>
              );
            })]
          ))}
        </div>
      </div>
      <div style={{ marginTop: 18, display: "flex", alignItems: "center", gap: 12 }}>
        <span style={{ fontSize: 11.5, color: "#888" }}>{fmt(vMin)}</span>
        <div style={{ flex: 1, height: 10, borderRadius: 5, background: "linear-gradient(90deg, #3b82f6, #fbbf24, #ef4444)" }} />
        <span style={{ fontSize: 11.5, color: "#888" }}>{fmt(vMax)}</span>
      </div>
      <div style={{ marginTop: 6, textAlign: "center", fontSize: 11.5, color: "#666" }}>середина шкали ≈ {fmt(vMid)}</div>
    </div>
  );
};

function Dashboard() {

  const [activeViews, setActiveViews] = useState(new Set(VIEWS));
  const [floorMode, setFloorMode] = useState("scatter");
  const [compRooms, setCompRooms] = useState(1);

  // Конкуренти: OZON завжди з повного лоту (не залежить від фільтрів)
  const ozonWeighted = useMemo(() => {
    const a = RAW.reduce((s, d) => s + d.area, 0);
    return a > 0 ? RAW.reduce((s, d) => s + d.totalPrice, 0) / a : 0;
  }, []);

  const compBarData = useMemo(() => {
    const rows = COMPETITORS.map(c => ({ name: c.name, price: c.price, ozon: false }));
    rows.push({ name: "OZON Concept House", price: Math.round(ozonWeighted), ozon: true });
    rows.sort((a, b) => b.price - a.price);
    return rows;
  }, [ozonWeighted]);

  const compRangeRows = useMemo(() => {
    const rows = [];
    const lot = RAW.filter(d => d.rooms === compRooms);
    if (lot.length) {
      const prices = lot.map(d => d.priceM2);
      rows.push({ label: "OZON — прайс лоту", min: Math.min(...prices), max: Math.max(...prices), ozon: true });
    }
    if (OZON_STRATEGY[compRooms]) {
      rows.push({ label: "OZON — стратегія P/ARC", min: OZON_STRATEGY[compRooms][0], max: OZON_STRATEGY[compRooms][1], ozon: true, dashed: true });
    }
    COMP_ROOMS[compRooms].forEach(c => rows.push({ label: c.name, min: c.min, max: c.max, color: "#60a5fa" }));
    return rows;
  }, [compRooms]);

  const toggle = (set, setter, val, all) => {
    const next = new Set(set);
    if (next.has(val)) { if (next.size > 1) next.delete(val); } else next.add(val);
    setter(next);
  };

  const filtered = useMemo(() =>
    RAW.filter(d => activeEntrances.has(d.entrance) && activeRooms.has(d.rooms) && activeViews.has(d.view) && d[metric] != null && !Number.isNaN(d[metric])),
    [activeEntrances, activeRooms, activeViews, metric]);

  const metricLabel = metric === "priceM2" ? "$/м²" : "Вартість, $";
  const fmt = metric === "priceM2" ? fmtM2 : fmtK;

  // Stats
  const totArea = filtered.reduce((a, d) => a + d.area, 0);
  const totValue = filtered.reduce((a, d) => a + d.totalPrice, 0);
  const wAvg = totArea > 0 ? totValue / totArea : 0;
  const st = calcStats(filtered.map(d => d[metric]));

  // 01 — floor data (розріз по кімнатності)
  const scatterByRooms = useMemo(() => {
    const m = {};
    ROOMS.forEach(r => { m[r] = filtered.filter(d => d.rooms === r).map(d => ({ ...d, y: d[metric] })); });
    return m;
  }, [filtered, metric]);

  const barData = useMemo(() => FLOORS.map(fl => {
    const row = { floor: fl };
    ROOMS.forEach(r => {
      const items = filtered.filter(d => d.floor === fl && d.rooms === r);
      if (items.length) {
        const a = items.reduce((s, d) => s + d.area, 0);
        row[`${r}-кімн.`] = metric === "priceM2" ? items.reduce((s, d) => s + d.totalPrice, 0) / a : items.reduce((s, d) => s + d.totalPrice, 0) / items.length;
      }
    });
    return row;
  }), [filtered, metric]);

  const yDomain = useMemo(() => {
    const vals = filtered.map(d => d[metric]);
    if (!vals.length) return [0, 100];
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = metric === "priceM2" ? 50 : (hi - lo) * 0.08;
    return [Math.floor((lo - pad) / 10) * 10, Math.ceil((hi + pad) / 10) * 10];
  }, [filtered, metric]);

  // 02 — distribution
  const distData = useMemo(() => {
    const vals = filtered.map(d => d[metric]);
    if (vals.length < 5) return { curve: [], stats: {} };
    const g = calcStats(vals);
    const perRooms = {};
    ROOMS.forEach(r => {
      const vv = filtered.filter(d => d.rooms === r).map(d => d[metric]);
      if (vv.length >= 5) perRooms[`${r}-кімн.`] = { ...calcStats(vv), rooms: r };
    });
    const pad = metric === "priceM2" ? 60 : (g.max - g.min) * 0.15;
    const lo = g.min - pad, hi = g.max + pad, N = 80;
    const pdf = (x, mu, sd) => sd > 0 ? (1 / (sd * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * ((x - mu) / sd) ** 2) : 0;
    const curve = Array.from({ length: N }, (_, i) => {
      const x = lo + (hi - lo) * i / (N - 1);
      const row = { x: Math.round(x), total: pdf(x, g.mean, g.std) };
      Object.entries(perRooms).forEach(([k, s]) => { row[k] = pdf(x, s.mean, s.std); });
      return row;
    });
    return { curve, stats: g, perRooms };
  }, [filtered, metric]);

  const hist = useMemo(() => buildHistogram(filtered.map(d => d[metric]), 10), [filtered, metric]);

  // 03 — box-plot groups
  const groupsEntrance = ENTRANCES.map(e => ({ label: `Під'їзд ${e}`, color: ENTR_C[e], values: filtered.filter(d => d.entrance === e).map(d => d[metric]) }));

  const groupsView = VIEWS.map(v => ({ label: v, color: VIEW_C[v], values: filtered.filter(d => d.view === v).map(d => d[metric]) }));
  const groupsFloor = [...FLOORS].reverse().map(fl => ({ label: `Поверх ${fl}`, color: GOLD, values: filtered.filter(d => d.floor === fl).map(d => d[metric]) }));

  const tbtn = (on) => ({
    padding: "7px 16px", borderRadius: 8, border: "none", cursor: "pointer", fontFamily: "inherit",
    fontSize: 13, fontWeight: 700, background: on ? GOLD : "transparent", color: on ? "#0f0f1a" : "#888"
  });

  return (
    <div style={{ minHeight: "100vh", background: "#0f0f1a", color: "#e2e8f0", fontFamily: "'DM Sans', 'Segoe UI', sans-serif", padding: "32px 28px 64px" }}>
      <style>{`body{margin:0;} ::-webkit-scrollbar{height:8px;width:8px;} ::-webkit-scrollbar-thumb{background:#333;border-radius:4px;}`}</style>
      <div style={{ maxWidth: 1280, margin: "0 auto" }}>

        {/* Header */}
        <div style={{ marginBottom: 28 }}>
          <div style={{ fontSize: 11, color: GOLD, fontWeight: 700, letterSpacing: 3, textTransform: "uppercase", marginBottom: 8 }}>Maxify · Цінова аналітика · Пресейл</div>
          <h1 style={{ fontSize: 28, fontWeight: 700, margin: 0 }}>Озон — лот квартир для пресейлу</h1>
          <div style={{ fontSize: 13.5, color: "#888", marginTop: 8 }}>2 під'їзди · поверхи −6…15 · {RAW.length} квартири · усі вільні · ціни в USD</div>
        </div>

        {/* Filters */}
        <div style={{ display: "flex", flexWrap: "wrap", gap: 20, alignItems: "flex-end", background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.05)", borderRadius: 14, padding: "18px 20px" }}>
          <div>
            <div style={{ fontSize: 11, color: "#777", textTransform: "uppercase", letterSpacing: 1.5, fontWeight: 600, marginBottom: 10 }}>Під'їзд</div>
            <div style={{ display: "flex", gap: 8 }}>
              {ENTRANCES.map(e => (
                <FilterBtn key={e} active={activeEntrances.has(e)} color={ENTR_C[e]} label={`Під'їзд ${e}`}
                  count={RAW.filter(d => d.entrance === e).length}

            <div style={{ display: "flex", gap: 8 }}>
              {ROOMS.map(r => (
                <FilterBtn key={r} active={activeRooms.has(r)} color={ROOM_C[r]} label={`${r}-кімн.`}

        {/* 02 Distribution */}

        {/* 05 Table */}

        <div style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.05)", borderRadius: 14, overflow: "hidden" }}>
          <div style={{ maxHeight: 460, overflowY: "auto" }}>

<script>
(function () {
  var AUTH_HASH = 1866392349;

  function djb2(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) | 0; }
    return h;
  }

  var btn = document.getElementById('lg-btn');
  var userEl = document.getElementById('lg-user');
  var passEl = document.getElementById('lg-pass');
  var errEl = document.getElementById('lg-err');
  var unlocked = false;

  function unlock() {
    if (unlocked) return;
    unlocked = true;
    errEl.className = 'login-loading';
    errEl.textContent = 'Завантаження дашборду…';
    setTimeout(function () {
      try {
        var src = document.getElementById('app-source').textContent;
        var compiled = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
        document.getElementById('login-screen').style.display = 'none';
        new Function(compiled)();
      } catch (e) {
        errEl.className = 'login-error';
        errEl.textContent = 'Помилка завантаження. Оновіть сторінку.';
        console.error(e);
        unlocked = false;
      }
    }, 30);
  }

  function tryLogin() {
    var login = (userEl.value || '').trim().toLowerCase();
    var pass = passEl.value || '';
    if (djb2(login + ':' + pass) === AUTH_HASH) {
      unlock();
    } else {
      errEl.className = 'login-error';
      errEl.textContent = 'Невірний логін або пароль';
      passEl.value = '';
      passEl.focus();
    }
  }

  btn.addEventListener('click', tryLogin);
  passEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryLogin(); });
  userEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') passEl.focus(); });
})();
</script>
