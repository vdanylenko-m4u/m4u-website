// ---- Utils ----
const fmtM2 = (v) => v == null ? "—" : "$" + Math.round(v).toLocaleString("uk-UA");
const fmtTotal = (v) => v == null ? "—" : "$" + Math.round(v).toLocaleString("uk-UA");
const fmtK = (v) => { if (v == null) return "—"; if (v >= 1e6) return "$" + (v / 1e6).toFixed(2) + "M"; if (v >= 1e3) return "$" + (v / 1e3).toFixed(0) + "K"; return "$" + Math.round(v); };

const calcStats = (arr) => {
  if (!arr.length) return { n: 0, min: 0, max: 0, mean: 0, std: 0, q1: 0, q3: 0, median: 0, iqr: 0 };
  const s = [...arr].sort((a, b) => a - b), n = s.length;
  const mean = s.reduce((a, b) => a + b, 0) / n;
  const std = Math.sqrt(s.reduce((a, v) => a + (v - mean) ** 2, 0) / n);
  const q = (p) => { const i = p * (n - 1), lo = Math.floor(i); return s[lo] + (s[Math.min(Math.ceil(i), n - 1)] - s[lo]) * (i - lo); };
  return { n, min: s[0], max: s[n - 1], mean, std, q1: q(0.25), q3: q(0.75), median: q(0.5), iqr: q(0.75) - q(0.25) };
};

const buildHistogram = (values, nBins = 10) => {
  if (values.length < 5) return [];
  const s = [...values].sort((a, b) => a - b);
  const vMin = s[0], vMax = s[s.length - 1];
  const binW = (vMax - vMin) / nBins;
  if (binW === 0) return [];
  return Array.from({ length: nBins }, (_, i) => {
    const lo = vMin + i * binW, hi = lo + binW;
    const count = i < nBins - 1 ? s.filter(v => v >= lo && v < hi).length : s.filter(v => v >= lo && v <= hi).length;
    return { x: Math.round((lo + hi) / 2), count, lo: Math.round(lo), hi: Math.round(hi) };
  });
};

const lerp = (a, b, t) => Math.round(a + (b - a) * t);
const heatColor = (value, min, max) => {
  if (value == null || max === min) return "#3b82f6";
  const t = Math.max(0, Math.min(1, (value - min) / (max - min)));
  if (t <= 0.5) { const p = t * 2; return `rgb(${lerp(59, 251, p)},${lerp(130, 191, p)},${lerp(246, 36, p)})`; }
  const p = (t - 0.5) * 2; return `rgb(${lerp(251, 239, p)},${lerp(191, 68, p)},${lerp(36, 68, p)})`;
};

  }, [groups, preserveOrder]);
  if (!rows.length) return null;
  const gMin = Math.min(...rows.map(r => r.stats.min));
  const gMax = Math.max(...rows.map(r => r.stats.max));

            <div style={{ position: "absolute", top: 12, left: `${X(r.stats.min)}%`, width: `${X(r.stats.max) - X(r.stats.min)}%`, height: 2, background: "rgba(255,255,255,0.18)" }} />

<script>
(function () {
  var AUTH_HASH = 1866392349;

  function djb2(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) | 0; }
    return h;
  }

  var btn = document.getElementById('lg-btn');
  var userEl = document.getElementById('lg-user');
  var passEl = document.getElementById('lg-pass');
  var errEl = document.getElementById('lg-err');
  var unlocked = false;

  function unlock() {
    if (unlocked) return;
    unlocked = true;
    errEl.className = 'login-loading';
    errEl.textContent = 'Завантаження дашборду…';
    setTimeout(function () {
      try {
        var src = document.getElementById('app-source').textContent;
        var compiled = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
        document.getElementById('login-screen').style.display = 'none';
        new Function(compiled)();
      } catch (e) {
        errEl.className = 'login-error';
        errEl.textContent = 'Помилка завантаження. Оновіть сторінку.';
        console.error(e);
        unlocked = false;
      }
    }, 30);
  }

  function tryLogin() {
    var login = (userEl.value || '').trim().toLowerCase();
    var pass = passEl.value || '';
    if (djb2(login + ':' + pass) === AUTH_HASH) {
      unlock();
    } else {
      errEl.className = 'login-error';
      errEl.textContent = 'Невірний логін або пароль';
      passEl.value = '';
      passEl.focus();
    }
  }

  btn.addEventListener('click', tryLogin);
  passEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryLogin(); });
  userEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') passEl.focus(); });
})();
</script>
