<title>Properly × GORO — захищена презентація</title>
<style>
:root{--ink:#0E1A1C;--line:#27474E;--bronze:#CC8E4F;--bronze2:#B0773C;--text:#ECF1F0;--muted:#90A6A8;--brick:#C0563F}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:radial-gradient(120% 120% at 80% -10%, #16302F 0%, var(--ink) 55%);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
.topo{position:fixed;inset:0;pointer-events:none;opacity:.5}
.topo svg{width:100%;height:100%}
.box{width:min(430px,90vw);text-align:center;position:relative;z-index:1;padding:0 20px}
.logo{color:#fff;display:flex;justify-content:center;margin-bottom:24px}
.logo svg{height:42px;width:auto}
h2{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:23px;margin:0 0 8px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 26px;line-height:1.5}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;background:#0C181A;border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;padding:12px 14px;letter-spacing:.08em;outline:none;transition:border-color .2s}
input:focus{border-color:var(--bronze)}
button{border:0;border-radius:10px;padding:12px 20px;background:linear-gradient(135deg,var(--bronze),var(--bronze2));color:#1a1206;font-weight:600;font-size:13.5px;cursor:pointer;font-family:inherit}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--brick);font-size:12.5px;min-height:18px;margin-top:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
.hint{color:var(--muted);font-size:11.5px;margin-top:22px;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em}
.shake .box{animation:sh .38s}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@media(prefers-reduced-motion:reduce){.shake .box{animation:none}}
</style>
</head>

const pw=document.getElementById('pw'),go=document.getElementById('go'),err=document.getElementById('err');
function b64(s){const b=atob(s);const a=new Uint8Array(b.length);for(let k=0;k<b.length;k++)a[k]=b.charCodeAt(k);return a;}
async function decrypt(pass){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(CFG.s),iterations:CFG.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(CFG.iv)},key,b64(CFG.ct));
  return new TextDecoder().decode(pt);
}
function fail(msg){err.textContent=msg;document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');go.disabled=false;go.textContent='Відкрити';pw.select();}
async function attempt(pass,silent){
  if(!(window.crypto&&crypto.subtle)){err.textContent='Браузер не підтримує розшифрування тут. Відкрийте файл локально або через https.';return;}
  go.disabled=true;go.textContent='Розшифрування…';err.textContent='';
  try{
    const html=await decrypt(pass);
    try{sessionStorage.setItem('pg_secure_pw',pass);}catch(e){}
    location.hash='#pgu';
    document.open();document.write(html);document.close();
  }catch(e){
    if(silent){go.disabled=false;go.textContent='Відкрити';}
    else fail('Невірний пароль — спробуйте ще раз');
  }
}
go.onclick=()=>attempt(pw.value.trim(),false);
pw.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();attempt(pw.value.trim(),false);}});
let saved='';try{saved=sessionStorage.getItem('pg_secure_pw')||'';}catch(e){}
if(saved){attempt(saved,true);}else{setTimeout(()=>pw.focus(),120);}
</script>
