  <script>
    function togglePwd(){
      var inp=document.getElementById('pwd-input');
      var open=document.getElementById('eye-open');
      var closed=document.getElementById('eye-closed');
      if(inp.type==='password'){inp.type='text';open.style.display='none';closed.style.display='inline';}
      else{inp.type='password';open.style.display='inline';closed.style.display='none';}
    }
    function hashStr(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return h;}
    function tryLogin(){
      if(hashStr(document.getElementById('pwd-input').value)===-933660616){
        document.getElementById('login-screen').style.display='none';
        startApp();
      }else{
        document.getElementById('login-error').style.display='block';
        document.getElementById('pwd-input').value='';
      }
    }
    document.addEventListener('DOMContentLoaded',function(){
      document.getElementById('pwd-btn').onclick=tryLogin;
      document.getElementById('pwd-input').addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});

function calcStats(arr){
  if(!arr.length)return null;
  const s=[...arr].sort((a,b)=>a-b),n=s.length;
  const mean=s.reduce((a,b)=>a+b,0)/n;
  const std=Math.sqrt(s.reduce((a,b)=>a+(b-mean)**2,0)/n);
  const pct=p=>{const i=p*(n-1),lo=Math.floor(i),hi=Math.ceil(i),fr=i-lo;return lo===hi?s[lo]:s[lo]*(1-fr)+s[hi]*fr;};
  return{mean,std,min:s[0],max:s[n-1],q1:pct(.25),median:pct(.5),q3:pct(.75),count:n};
}
function gaussianPDF(mean,std,x){return std===0?0:(1/(std*Math.sqrt(2*Math.PI)))*Math.exp(-0.5*((x-mean)/std)**2);}
function buildDecileHistogram(values){
  if(values.length<10)return[];
  const s=[...values].sort((a,b)=>a-b),n=s.length;
  const pct=p=>{const i=p*(n-1),lo=Math.floor(i),hi=Math.ceil(i),fr=i-lo;return lo===hi?s[lo]:s[lo]*(1-fr)+s[hi]*fr;};
  const bounds=[s[0]];for(let k=1;k<=9;k++)bounds.push(pct(k/10));bounds.push(s[n-1]+0.01);
  return Array.from({length:10},(_,i)=>{const lo=bounds[i],hi=bounds[i+1];const cnt=s.filter(v=>v>=lo&&v<hi).length;return{x:`D${i+1}`,count:cnt,lo:Math.round(lo),hi:Math.round(hi),pct:Math.round(cnt/n*100)};});
}
function buildHistogram(values,nBins=12){
  if(values.length<5)return[];
  const s=[...values].sort((a,b)=>a-b);
  const vMin=s[0],vMax=s[s.length-1];
  const binW=(vMax-vMin)/nBins;
  if(binW===0)return[];
  return Array.from({length:nBins},(_,i)=>{
    const lo=vMin+i*binW,hi=lo+binW;
    const cnt=s.filter(v=>v>=lo&&(i===nBins-1?v<=hi:v<hi)).length;
    return{x:Math.round(lo),count:cnt,lo:Math.round(lo),hi:Math.round(hi)};
  });
}

function toggle(set,setter,val){
  const n=new Set(set);
  if(n.has(val)){if(n.size>1)n.delete(val);}else n.add(val);
  setter(n);
}

function RangeBar({label,min,max,q1,median,q3,mean,count,globalMin,globalMax,color}){
  const[hovered,setHovered]=useState(false);
  const r=globalMax-globalMin||1;
  const toP=v=>((v-globalMin)/r)*100;
  return(<div style={{display:"flex",alignItems:"center",gap:12,marginBottom:6,position:"relative"}} onMouseEnter={()=>setHovered(true)} onMouseLeave={()=>setHovered(false)}>
    <div style={{width:150,minWidth:150,fontSize:12,color:"#ccc",textAlign:"right",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",cursor:"default"}}>{label} <span style={{color:"#555",fontSize:10}}>({count})</span></div>

      <div style={{position:"absolute",top:13,left:`${toP(min)}%`,width:`${toP(max)-toP(min)}%`,height:2,background:"#555"}}/>

}

function RangeChart({title,entries,metric}){
  if(!entries.length)return null;
  const allStats=entries.map(e=>e.stats).filter(Boolean);
  if(!allStats.length)return null;
  const globalMin=Math.min(...allStats.map(s=>s.min));
  const globalMax=Math.max(...allStats.map(s=>s.max));
  const step=metric==="priceM2"?1000:500000;
  const tMin=Math.floor(globalMin/step)*step;
  const tMax=Math.ceil(globalMax/step)*step;
  const ticks=[];for(let v=tMin;v<=tMax;v+=step)ticks.push(v);
  return(<div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.05)",borderRadius:14,padding:"20px 16px 16px",marginBottom:12}}>
    <div style={{fontSize:14,fontWeight:600,color:"#e2e8f0",marginBottom:14,paddingLeft:162}}>{title}</div>

      <div style={{width:150,minWidth:150}}/>
      <div style={{flex:1,position:"relative",height:16}}>
        {ticks.map(v=><div key={v} style={{position:"absolute",left:`${((v-globalMin)/((globalMax-globalMin)||1))*100}%`,transform:"translateX(-50%)",fontSize:10,color:"#555",fontVariantNumeric:"tabular-nums"}}>{fmtK(v)}</div>)}
      </div>
      <div style={{width:130,minWidth:130}}/>
    </div>
    {entries.map((e,i)=><RangeBar key={e.label} label={e.label} {...e.stats} globalMin={globalMin} globalMax={globalMax} color={PALETTE[i%PALETTE.length]}/>)}
    <div style={{display:"flex",gap:16,marginTop:14,paddingLeft:162,fontSize:11,color:"#666",flexWrap:"wrap"}}>
      <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:20,height:10,background:"rgba(255,255,255,0.15)",borderRadius:2,border:"1px solid rgba(255,255,255,0.2)",display:"inline-block"}}/> IQR</span>

function heatColor(value,min,max){
  const mid=(min+max)/2;
  const t=max===min?0.5:(value-min)/(max-min);
  const lerp=(a,b,p)=>Math.round(a+(b-a)*p);
  if(t<=0.5){const p=t*2;return`rgb(${lerp(59,251,p)},${lerp(130,191,p)},${lerp(246,36,p)})`;}
  else{const p=(t-0.5)*2;return`rgb(${lerp(251,239,p)},${lerp(191,68,p)},${lerp(36,68,p)})`;}
}

function Dashboard(){
  const[activeBuildings,setActiveBuildings]=useState(new Set(BUILDINGS));
  const[activeStatuses,setActiveStatuses]=useState(new Set(["Вільно","Продано"]));
  const[activeRooms,setActiveRooms]=useState(new Set([1,2,3]));
  const[metric,setMetric]=useState("priceM2");
  const[chartMode,setChartMode]=useState("scatter");
  const mLabel=metric==="priceM2"?"грн/м²":"Вартість, грн";
  const mField=metric;
  const activeBArr=BUILDINGS.filter(b=>activeBuildings.has(b));

  const filtered=useMemo(()=>RAW.filter(d=>activeBuildings.has(d.building)&&activeStatuses.has(d.status)&&activeRooms.has(d.rooms)&&d[metric]!=null&&!Number.isNaN(d[metric])),[activeBuildings,activeStatuses,activeRooms,metric]);

  const stats=useMemo(()=>{const vals=filtered.map(d=>d[metric]);return calcStats(vals);},[filtered,metric]);

  const weightedPriceM2=useMemo(()=>{
    const withPrice=filtered.filter(d=>d.totalPrice&&d.area);
    if(!withPrice.length)return null;
    const totalVal=withPrice.reduce((a,d)=>a+d.totalPrice,0);
    const totalArea=withPrice.reduce((a,d)=>a+d.area,0);
    return totalArea>0?totalVal/totalArea:null;
  },[filtered]);

  const scatterByBuilding=useMemo(()=>{
    const byB={};BUILDINGS.forEach(b=>byB[b]=filtered.filter(d=>d.building===b));return byB;
  },[filtered]);

  const barData=useMemo(()=>{
    const floors=[...new Set(filtered.map(d=>d.floor))].sort((a,b)=>a-b);
    return floors.map(fl=>{
      const row={floor:fl};
      BUILDINGS.filter(b=>activeBuildings.has(b)).forEach(b=>{
        const vals=filtered.filter(d=>d.floor===fl&&d.building===b).map(d=>d[metric]);
        row[b]=vals.length?Math.round(vals.reduce((a,c)=>a+c,0)/vals.length):null;
      });
      return row;
    });
  },[filtered,activeBuildings,metric]);

  const distData=useMemo(()=>{
    const allVals=filtered.map(d=>d[metric]);
    const statsAll=calcStats(allVals);
    if(!statsAll||statsAll.count<3)return{curve:[],histogram:[],statsAll:null,byB:{}};
    const gPDF=gaussianPDF;
    const bStats={};
    BUILDINGS.forEach(b=>{const bv=filtered.filter(d=>d.building===b).map(d=>d[metric]);if(bv.length)bStats[b]=calcStats(bv);});
    const rawCurves={};let globalPeak=0;
    const allPeak=gPDF(statsAll.mean,statsAll.std,statsAll.mean);
    BUILDINGS.forEach(b=>{if(bStats[b]){const pk=gPDF(bStats[b].mean,bStats[b].std,bStats[b].mean);rawCurves[b]=pk;if(pk>globalPeak)globalPeak=pk;}});
    const pad=metric==="priceM2"?500:100000;
    const lo=statsAll.min-pad,hi=statsAll.max+pad;
    const pts=80;const curve=[];
    for(let i=0;i<=pts;i++){
      const x=lo+(hi-lo)*(i/pts);
      const row={x:Math.round(x),all:gPDF(statsAll.mean,statsAll.std,x)};
      BUILDINGS.forEach(b=>{if(bStats[b]){const raw=gPDF(bStats[b].mean,bStats[b].std,x);row[b]=allPeak>0&&rawCurves[b]>0?raw*(allPeak/rawCurves[b]):raw;}});
      curve.push(row);
    }
    const histogram=buildHistogram(allVals,14);
    return{curve,histogram,statsAll,byB:bStats};
  },[filtered,metric]);

  const rangeByBuilding=useMemo(()=>BUILDINGS.filter(b=>activeBuildings.has(b)).map(b=>({label:LABELS[b]||b,items:filtered.filter(d=>d.building===b)})),[filtered,activeBuildings]);
  const rangeByRooms=useMemo(()=>[1,2,3].filter(r=>activeRooms.has(r)).map(r=>({label:`${r}-кімн`,items:filtered.filter(d=>d.rooms===r)})),[filtered,activeRooms]);
  const rangeByView=useMemo(()=>{const views=[...new Set(filtered.map(d=>d.view))];return views.map(v=>({label:v,items:filtered.filter(d=>d.view===v)}));},[filtered]);
  const rangeByLayout=useMemo(()=>{
    const layouts=[...new Set(filtered.map(d=>d.layout))].sort();
    return layouts.map(l=>({label:l,items:filtered.filter(d=>d.layout===l)}));
  },[filtered]);
  const rangeByFloor=useMemo(()=>{
    const floors=[...new Set(filtered.map(d=>d.floor))].sort((a,b)=>a-b);
    return floors.map(fl=>({label:`${fl} пов.`,items:filtered.filter(d=>d.floor===fl)}));
  },[filtered]);

  function makeRangeEntries(groups){
    return groups.map(g=>{const vals=g.items.map(d=>d[metric]).filter(v=>v!=null);const s=calcStats(vals);return{label:g.label,stats:s};}).filter(e=>e.stats);
  }

  const planData=useMemo(()=>{
    let cum=0;
    return SALES_PLAN.map(p=>{cum+=p.planAmount;return{...p,cumAmount:cum};});
  },[]);

  const totalArea=RAW.reduce((a,d)=>a+d.area,0);
  const totalValue=RAW.reduce((a,d)=>a+(d.totalPrice||0),0);

  const yDomain=useMemo(()=>{
    const vals=filtered.map(d=>d[metric]);
    if(!vals.length)return[0,100];

    return[Math.floor((mn-pad)/1000)*1000,Math.ceil((mx+pad)/1000)*1000];
  },[filtered,metric]);

  return(
    <div style={{fontFamily:"'DM Sans','Segoe UI',system-ui,sans-serif",color:"#e2e8f0",maxWidth:1200,margin:"0 auto",padding:"32px 24px",background:"#0f0f1a",minHeight:"100vh"}}>

      {/* Filters */}
      <div style={{marginTop:20,display:"flex",flexWrap:"wrap",gap:8,alignItems:"center"}}>
        {BUILDINGS.map(b=>(<FilterBtn key={b} active={activeBuildings.has(b)} color={COLORS[b]} bg={BG[b]} onClick={()=>toggle(activeBuildings,setActiveBuildings,b)}>{LABELS[b]} ({RAW.filter(d=>d.building===b).length})</FilterBtn>))}
        <span style={{width:1,height:24,background:"rgba(255,255,255,0.06)",margin:"0 4px"}}/>
        {[1,2,3].map(r=>(<FilterBtn key={r} active={activeRooms.has(r)} onClick={()=>toggle(activeRooms,setActiveRooms,r)}>{r}к ({RAW.filter(d=>d.rooms===r).length})</FilterBtn>))}
        <span style={{width:1,height:24,background:"rgba(255,255,255,0.06)",margin:"0 4px"}}/>
        <div style={{display:"flex",gap:4,background:"rgba(255,255,255,0.03)",borderRadius:10,padding:4}}>
          <button style={{padding:"6px 14px",borderRadius:8,border:"none",background:metric==="priceM2"?"#fbbf24":"transparent",color:metric==="priceM2"?"#0f0f1a":"#666",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}} onClick={()=>setMetric("priceM2")}>грн/м²</button>
          <button style={{padding:"6px 14px",borderRadius:8,border:"none",background:metric==="totalPrice"?"#fbbf24":"transparent",color:metric==="totalPrice"?"#0f0f1a":"#666",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}} onClick={()=>setMetric("totalPrice")}>Вартість</button>

        <ResponsiveContainer width="100%" height={480}><BarChart data={barData} margin={{top:10,right:20,bottom:20,left:20}} barCategoryGap="12%">
          <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.04)"/>
          <XAxis dataKey="floor" tick={{fill:"#888",fontSize:11}} label={{value:"Поверх",position:"bottom",offset:0,fill:"#666",fontSize:12}}/>
          <YAxis domain={yDomain} tick={{fill:"#888",fontSize:11}} tickFormatter={v=>fmtK(v)} label={{value:mLabel,angle:-90,position:"insideLeft",offset:10,fill:"#666",fontSize:12}}/>
          <Tooltip content={<BarTooltip/>}/>
          {activeBArr.map(b=>(<Bar key={b} dataKey={b} name={LABELS[b]} fill={COLORS[b]} maxBarSize={24} radius={[4,4,0,0]}/>))}
        </BarChart></ResponsiveContainer>
        <div style={{display:"flex",justifyContent:"center",gap:12,paddingBottom:4,fontSize:11,color:"#888",flexWrap:"wrap"}}>
          {activeBArr.map(b=>(<span key={b} style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:9,height:9,borderRadius:5,background:COLORS[b],display:"inline-block"}}/> {LABELS[b]}</span>))}
        </div>
      </div>)}

      {/* Section 02 - Distribution */}
      <SectionTitle num="02" title="Розподіл цін" sub="Крива Гауса та децильна гістограма"/>
      <div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.05)",borderRadius:14,padding:"20px 12px 12px 0",marginBottom:16}}>
        <ResponsiveContainer width="100%" height={300}><ComposedChart data={distData.curve} margin={{top:10,right:20,bottom:20,left:10}}>
          <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.04)"/>
          <XAxis dataKey="x" tick={{fill:"#888",fontSize:11}} tickFormatter={v=>fmtK(v)} label={{value:mLabel,position:"bottom",offset:0,fill:"#666",fontSize:12}}/>
          <YAxis tick={false}/>
          <Tooltip labelFormatter={v=>`${fmt(v)} ${metric==="priceM2"?"грн/м²":"грн"}`} contentStyle={{background:"#1a1a2e",border:"1px solid rgba(255,255,255,0.12)",borderRadius:10,fontSize:13,color:"#ccc"}}/>
          <Area type="monotone" dataKey="all" stroke="#fbbf24" fill="#fbbf24" fillOpacity={0.06} strokeWidth={2.5} dot={false} name="Загальний"/>
          {BUILDINGS.filter(b=>activeBuildings.has(b)&&distData.byB[b]?.count>2).map(b=>(<Line key={b} type="monotone" dataKey={b} stroke={COLORS[b]} strokeWidth={2} dot={false} strokeDasharray="6 3" name={LABELS[b]}/>))}
          {distData.statsAll?.count>0&&<ReferenceLine x={Math.round(distData.statsAll.mean)} stroke="#fbbf24" strokeDasharray="4 4" strokeWidth={1.5}/>}
        </ComposedChart></ResponsiveContainer>
        <div style={{display:"flex",justifyContent:"center",gap:12,paddingBottom:4,fontSize:11,color:"#888",flexWrap:"wrap"}}>
          <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:14,height:2,background:"#fbbf24",display:"inline-block"}}/> Загальний (μ={stats?fmt(Math.round(stats.mean)):""}, σ={stats?fmt(Math.round(stats.std)):""})</span>
          {BUILDINGS.filter(b=>activeBuildings.has(b)&&distData.byB[b]).map(b=>(<span key={b} style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:14,height:0,borderTop:"2px dashed",borderColor:COLORS[b],display:"inline-block"}}/> {LABELS[b]} (μ={fmt(Math.round(distData.byB[b].mean))})</span>))}
        </div>
      </div>
      {distData.histogram.length>0&&<div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.05)",borderRadius:14,padding:"20px 12px 12px 0",marginBottom:16}}>
        <div style={{paddingLeft:20,marginBottom:8,fontSize:14,fontWeight:600}}>Гістограма розподілу</div>
        <ResponsiveContainer width="100%" height={280}><BarChart data={distData.histogram} margin={{top:10,right:20,bottom:50,left:10}}>
          <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.04)"/>
          <XAxis dataKey="lo" tick={{fill:"#888",fontSize:10}} tickFormatter={v=>fmtK(v)} angle={-35} textAnchor="end" label={{value:mLabel,position:"bottom",offset:30,fill:"#666",fontSize:11}}/>
          <YAxis tick={{fill:"#888",fontSize:11}} label={{value:"Кількість",angle:-90,position:"insideLeft",offset:10,fill:"#666",fontSize:11}}/>
          <Bar dataKey="count" radius={[6,6,0,0]}>{distData.histogram.map((d,i)=>{const t=distData.histogram.length>1?i/(distData.histogram.length-1):0;const r=Math.round(59+(251-59)*Math.min(t*2,1)*(t<=0.5?1:0)+(251+(239-251)*Math.min((t-0.5)*2,1))*(t>0.5?1:0));const g=Math.round(130+(191-130)*Math.min(t*2,1)*(t<=0.5?1:0)+(191+(68-191)*Math.min((t-0.5)*2,1))*(t>0.5?1:0));const b2=Math.round(246+(36-246)*Math.min(t*2,1)*(t<=0.5?1:0)+(36+(68-36)*Math.min((t-0.5)*2,1))*(t>0.5?1:0));return<Cell key={i} fill={`rgb(${r},${g},${b2})`}/>;})}</Bar>
          <Tooltip formatter={(v,n,p)=>[`${v} квартир`,`${fmt(p.payload.lo)} – ${fmt(p.payload.hi)}`]} contentStyle={{background:"#1a1a2e",border:"1px solid rgba(255,255,255,0.12)",borderRadius:10,fontSize:12,color:"#ccc"}}/>
        </BarChart></ResponsiveContainer>
      </div>}

      {/* Section 03 - Box-plots */}
      <SectionTitle num="03" title="Порівняння діапазонів цін" sub={mLabel}/>
      <RangeChart title="За секцією" entries={makeRangeEntries(rangeByBuilding)} metric={metric}/>
      <RangeChart title="За кімнатністю" entries={makeRangeEntries(rangeByRooms).sort((a,b)=>(a.stats?.median||0)-(b.stats?.median||0))} metric={metric}/>
      <RangeChart title="За видом з вікна" entries={makeRangeEntries(rangeByView).sort((a,b)=>(a.stats?.median||0)-(b.stats?.median||0))} metric={metric}/>
      <RangeChart title="За типом планування" entries={makeRangeEntries(rangeByLayout)} metric={metric}/>
      <RangeChart title="За поверхом" entries={makeRangeEntries(rangeByFloor)} metric={metric}/>

      {/* Section 03b - Area ranges by rooms */}
      <SectionTitle num="03b" title="Порівняння площ за кімнатністю" sub="Діапазони площ (м²)"/>
      {(()=>{
        const areaGroups=[1,2,3].filter(r=>activeRooms.has(r)).map(r=>{const items=filtered.filter(d=>d.rooms===r);const vals=items.map(d=>d.area);const s=calcStats(vals);return{label:`${r}-кімн`,stats:s};}).filter(e=>e.stats);
        if(!areaGroups.length)return null;
        const gMin=Math.min(...areaGroups.map(e=>e.stats.min));
        const gMax=Math.max(...areaGroups.map(e=>e.stats.max));
        return(<div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.05)",borderRadius:14,padding:"20px 16px 16px",marginBottom:12}}>
          {areaGroups.map((e,i)=><RangeBar key={e.label} label={e.label} {...e.stats} globalMin={gMin} globalMax={gMax} color={PALETTE[i%PALETTE.length]}/>)}
        </div>);
      })()}

      {/* Section 04 - Income Plan */}
      <SectionTitle num="04" title="Дохідний план" sub="Планові показники продажів · травень 2026 – жовтень 2028"/>
      <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap"}}>
        <StatCard label="Планова виручка" value={`${(planData[planData.length-1]?.cumAmount/1e9).toFixed(2)} млрд грн`} color="#fbbf24"/>
        <StatCard label="Середньозважена план" value={`${fmt(Math.round(SALES_PLAN.reduce((a,p)=>a+p.planAmount,0)/SALES_PLAN.reduce((a,p)=>a+p.planArea,0)))} грн`} color="#818cf8"/>
        <StatCard label="Стартова ціна/м²" value={`${fmt(SALES_PLAN[0].planPriceM2)} грн`}/>
        <StatCard label="Фінальна ціна/м²" value={`${fmt(SALES_PLAN[SALES_PLAN.length-1].planPriceM2)} грн`}/>
        <StatCard label="Приріст ціни" value={`+${Math.round((SALES_PLAN[SALES_PLAN.length-1].planPriceM2/SALES_PLAN[0].planPriceM2-1)*100)}%`} color="#22c55e"/>
      </div>
      <div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.05)",borderRadius:14,padding:"20px 12px 12px 0",marginBottom:16}}>
        <div style={{paddingLeft:20,marginBottom:8,fontSize:14,fontWeight:600}}>Планова ціна/м² по місяцях</div>
        <ResponsiveContainer width="100%" height={300}><ComposedChart data={SALES_PLAN} margin={{top:10,right:20,bottom:30,left:20}}>
          <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.04)"/>
          <XAxis dataKey="month" tick={{fill:"#888",fontSize:10}} angle={-35} textAnchor="end"/>
          <YAxis tick={{fill:"#888",fontSize:11}} tickFormatter={v=>fmtK(v)} domain={["dataMin-500","dataMax+500"]}/>
          <Line type="monotone" dataKey="planPriceM2" stroke="#fbbf24" strokeWidth={2.5} dot={{r:3,fill:"#fbbf24"}} name="Планова ціна/м²"/>
          <Tooltip formatter={(v)=>[`${fmt(v)} грн/м²`]} contentStyle={{background:"#1a1a2e",border:"1px solid rgba(255,255,255,0.12)",borderRadius:10,fontSize:12,color:"#ccc"}}/>
        </ComposedChart></ResponsiveContainer>
      </div>
      <div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.05)",borderRadius:14,padding:"20px 12px 12px 0",marginBottom:16}}>
        <div style={{paddingLeft:20,marginBottom:8,fontSize:14,fontWeight:600}}>Кумулятивна планова виручка</div>
        <ResponsiveContainer width="100%" height={300}><ComposedChart data={planData} margin={{top:10,right:20,bottom:30,left:20}}>
          <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.04)"/>
          <XAxis dataKey="month" tick={{fill:"#888",fontSize:10}} angle={-35} textAnchor="end"/>
          <YAxis tick={{fill:"#888",fontSize:11}} tickFormatter={v=>(v/1e9).toFixed(1)+"B"}/>
          <Area type="monotone" dataKey="cumAmount" stroke="#22c55e" fill="#22c55e" fillOpacity={0.08} strokeWidth={2.5} name="Кумулятивна виручка"/>
          <Tooltip formatter={(v)=>[`${(v/1e6).toFixed(1)} млн грн`]} contentStyle={{background:"#1a1a2e",border:"1px solid rgba(255,255,255,0.12)",borderRadius:10,fontSize:12,color:"#ccc"}}/>
        </ComposedChart></ResponsiveContainer>
      </div>
      <div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.05)",borderRadius:14,padding:"20px 12px 12px 0",marginBottom:16}}>
        <div style={{paddingLeft:20,marginBottom:8,fontSize:14,fontWeight:600}}>Планова площа продажів / місяць</div>
        <ResponsiveContainer width="100%" height={300}><BarChart data={SALES_PLAN} margin={{top:10,right:20,bottom:30,left:20}}>
          <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.04)"/>
          <XAxis dataKey="month" tick={{fill:"#888",fontSize:10}} angle={-35} textAnchor="end"/>
          <YAxis tick={{fill:"#888",fontSize:11}} tickFormatter={v=>`${v} м²`}/>
          <Bar dataKey="planArea" name="Площа, м²" fill="#818cf8" radius={[4,4,0,0]} maxBarSize={32}/>
          <Tooltip formatter={(v)=>[`${Math.round(v).toLocaleString("uk-UA")} м²`]} contentStyle={{background:"#1a1a2e",border:"1px solid rgba(255,255,255,0.12)",borderRadius:10,fontSize:12,color:"#ccc"}}/>
        </BarChart></ResponsiveContainer>
      </div>

      {/* Section 05 - Data table */}
      <SectionTitle num="05" title="Дані квартир" sub={`${filtered.length} записів`}/>
      <div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.05)",borderRadius:14,overflow:"hidden",marginBottom:16}}>
        <div style={{maxHeight:600,overflow:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{position:"sticky",top:0,background:"#14142b",zIndex:1}}>
              {["№","Пов.","Кімн.","Площа","Статус","грн/м²","Вартість","Планув.","Вид","Секція"].map(h=>(
                <th key={h} style={{padding:"10px 8px",textAlign:"left",fontSize:11,fontWeight:600,color:"#666",textTransform:"uppercase",letterSpacing:1,borderBottom:"1px solid rgba(255,255,255,0.06)"}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>{filtered.slice(0,200).map(d=>(
              <tr key={d.number} style={{borderBottom:"1px solid rgba(255,255,255,0.03)"}}>
                <td style={{padding:"8px",fontWeight:600}}>{d.number}</td>
                <td style={{padding:"8px"}}>{d.floor}</td>
                <td style={{padding:"8px"}}><span style={{display:"inline-block",padding:"2px 8px",borderRadius:6,fontSize:11,fontWeight:600,background:d.rooms===1?"rgba(96,165,250,0.15)":d.rooms===2?"rgba(52,211,153,0.15)":"rgba(251,191,36,0.15)",color:d.rooms===1?"#60a5fa":d.rooms===2?"#34d399":"#fbbf24"}}>{d.rooms}к</span></td>
                <td style={{padding:"8px",fontVariantNumeric:"tabular-nums"}}>{d.area} м²</td>
                <td style={{padding:"8px"}}><span style={{color:STATUS_COLORS[d.status]||"#888",fontSize:11,fontWeight:600}}>{d.status}</span></td>
                <td style={{padding:"8px",color:metric==="priceM2"?"#fbbf24":"#ccc",fontWeight:metric==="priceM2"?700:400,fontVariantNumeric:"tabular-nums"}}>{fmt(d.priceM2)}</td>
                <td style={{padding:"8px",color:metric==="totalPrice"?"#fbbf24":"#ccc",fontWeight:metric==="totalPrice"?700:400,fontVariantNumeric:"tabular-nums"}}>{fmt(d.totalPrice)}</td>
                <td style={{padding:"8px",color:"#888",fontSize:11}}>{d.layout}</td>
                <td style={{padding:"8px",color:"#888",fontSize:11,maxWidth:140,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.view}</td>
                <td style={{padding:"8px",color:"#888"}}>{d.entrance}</td>
              </tr>
            ))}</tbody>
          </table>
        </div>
        {filtered.length>200&&<div style={{padding:12,textAlign:"center",color:"#555",fontSize:12}}>Показано 200 з {filtered.length}</div>}
      </div>

      {/* Section 06 - Chess Board */}
      <SectionTitle num="06" title="Шахматка" sub={`Heatmap по ${mLabel}`}/>
      {activeBArr.map(b=>(<ChessBoard key={b} data={filtered} building={b} metric={metric}/>))}

      {/* Footer */}
      <div style={{marginTop:48,paddingTop:20,borderTop:"1px solid rgba(255,255,255,0.05)",fontSize:11,color:"#444",textAlign:"center"}}>
        Русанівська Гавань 9-12 · Цінова аналітика · М4Ю · {new Date().getFullYear()}
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(Dashboard));
  </script>
</body>
</html>
