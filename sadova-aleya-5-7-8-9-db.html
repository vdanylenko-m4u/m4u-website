const fmt = n => (n==null || Number.isNaN(n)) ? "—" : Math.round(n).toLocaleString("uk-UA");
const fmtM = n => (n==null || Number.isNaN(n)) ? "—" : "$" + fmt(n);
const fmtK = n => (n==null || Number.isNaN(n)) ? "—" : "$" + (n/1000).toFixed(1).replace(".",",") + "k";
const fmtA = n => (n==null || Number.isNaN(n)) ? "—" : n.toLocaleString("uk-UA",{minimumFractionDigits:1,maximumFractionDigits:1});

function quantile(sorted, p) {
  if (!sorted.length) return null;
  const idx = p * (sorted.length - 1);
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
}
function calcStats(arr) {
  const v = arr.filter(x => x != null && !Number.isNaN(x)).slice().sort((a,b)=>a-b);
  if (!v.length) return {count:0, mean:null, std:null, min:null, max:null, median:null, q1:null, q3:null};
  const mean = v.reduce((s,x)=>s+x,0)/v.length;
  const std = Math.sqrt(v.reduce((s,x)=>s+(x-mean)*(x-mean),0)/v.length);
  return {count:v.length, mean, std, min:v[0], max:v[v.length-1], median:quantile(v,0.5), q1:quantile(v,0.25), q3:quantile(v,0.75)};
}
function gaussianPDF(x, mean, std) {
  if (!std) return 0;
  return (1/(std*Math.sqrt(2*Math.PI))) * Math.exp(-0.5*Math.pow((x-mean)/std,2));
}
const lerp = (a,b,t) => Math.round(a + (b-a)*t);
function heatColor(value, min, max) {
  if (value==null || Number.isNaN(value) || max<=min) return "rgba(255,255,255,0.06)";
  const t = Math.max(0, Math.min(1, (value-min)/(max-min)));
  if (t <= 0.5) { const p = t*2; return `rgb(${lerp(59,251,p)},${lerp(130,191,p)},${lerp(246,36,p)})`; }
  const p = (t-0.5)*2; return `rgb(${lerp(251,239,p)},${lerp(191,68,p)},${lerp(36,68,p)})`;
}

}

/* ============================== HOVER POPUP ============================== */
function HoverPop({tip}) {
  if (!tip) return null;
  const W = 260, H = 250;
  const vw = typeof window !== "undefined" ? window.innerWidth : 1400;
  const vh = typeof window !== "undefined" ? window.innerHeight : 900;
  const x = tip.x + 16 + W > vw ? tip.x - W - 16 : tip.x + 16;
  const y = tip.y + 16 + H > vh ? Math.max(8, tip.y - H) : tip.y + 16;
  return (
    <div style={{position:"fixed", left:x, top:y, zIndex:1000, pointerEvents:"none", width:"max-content", maxWidth:W, ...TIP_BOX, boxShadow:"0 8px 28px rgba(0,0,0,0.55)"}}>
      {tip.content}
    </div>
  );
}

/* ============================== BOX-PLOT ============================== */
function RangeChart({groups, colorFn, valueFmt}) {
  const [tip, setTip] = useState(null);
  const totalCount = groups.reduce((a,g)=>a+(g.stats.count||0),0);
  const valid = groups.filter(g => g.stats.count > 0);
  if (!valid.length) return <div style={{color:"#555", fontSize:13, padding:"14px 0"}}>Немає даних для обраних фільтрів</div>;
  const gmin = Math.min(...valid.map(g=>g.stats.min));
  const gmax = Math.max(...valid.map(g=>g.stats.max));
  const span = gmax - gmin || 1;
  const X = v => ((v - gmin) / span) * 100;
  return (
    <div>
      {groups.map((g,i) => {
        const s = g.stats;
        const color = colorFn ? colorFn(g) : GOLD;
        if (!s.count) return (
          <div key={i} style={{display:"flex", alignItems:"center", height:34}}>
            <div style={{width:150, fontSize:12.5, color:"#444", flexShrink:0, paddingRight:10}}>{g.label}</div>
            <div style={{flex:1, fontSize:12, color:"#3a3a4a"}}>—</div>
          </div>
        );
        return (
          <div key={i} className="bprow" style={{display:"flex", alignItems:"center", height:34, borderRadius:8, padding:"0 6px", margin:"0 -6px", cursor:"default"}}
            onMouseEnter={e=>setTip({x:e.clientX, y:e.clientY, content:<StatsTipBody label={g.label} s={s} valueFmt={valueFmt} share={totalCount?Math.round(s.count/totalCount*100):null} />})}
            onMouseMove={e=>setTip({x:e.clientX, y:e.clientY, content:<StatsTipBody label={g.label} s={s} valueFmt={valueFmt} share={totalCount?Math.round(s.count/totalCount*100):null} />})}
            onMouseLeave={()=>setTip(null)}>
            <div style={{width:150, fontSize:12.5, color:"#999", flexShrink:0, paddingRight:10, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}
                 title={g.label}>{g.label} <span style={{color:"#555", fontSize:11}}>({s.count})</span></div>
            <div style={{flex:1, position:"relative", height:22}}>
              <div style={{position:"absolute", top:10, left:X(s.min)+"%", width:(X(s.max)-X(s.min))+"%", height:2, background:"rgba(255,255,255,0.14)"}} />
              <div style={{position:"absolute", top:5, left:X(s.min)+"%", width:1.5, height:12, background:"rgba(255,255,255,0.3)"}} />
              <div style={{position:"absolute", top:5, left:X(s.max)+"%", width:1.5, height:12, background:"rgba(255,255,255,0.3)"}} />
              <div style={{position:"absolute", top:3, left:X(s.q1)+"%", width:Math.max(X(s.q3)-X(s.q1),0.5)+"%", height:16, background:color+"33", border:`1px solid ${color}66`, borderRadius:3}} />
              <div style={{position:"absolute", top:2, left:X(s.median)+"%", width:2, height:18, background:color, borderRadius:1}} />
              <div style={{position:"absolute", top:7, left:`calc(${X(s.mean)}% - 4px)`, width:8, height:8, borderRadius:4, background:"#fff", border:`2px solid ${color}`}} />
            </div>
            <div style={{width:150, fontSize:11.5, color:"#666", textAlign:"right", flexShrink:0, fontVariantNumeric:"tabular-nums"}}>
              {valueFmt(s.min)} – {valueFmt(s.max)}
            </div>
          </div>
        );
      })}
      <div style={{display:"flex", gap:18, marginTop:12, fontSize:11, color:"#555", flexWrap:"wrap"}}>
        <span><span style={{display:"inline-block",width:14,height:8,background:"rgba(251,191,36,0.2)",border:"1px solid rgba(251,191,36,0.4)",borderRadius:2,verticalAlign:"middle",marginRight:5}} />IQR (Q1–Q3)</span>

function SellThrough({groups, mode}) {
  const [tip, setTip] = useState(null);
  const M = d => mode==="count" ? 1 : mode==="area" ? (d.area||0) : (d.totalPrice||0);
  const rows = groups.map(g => {
    const seg = {sold:[], free:[], nd:[]};
    g.items.forEach(d => {
      if (d.status==="Продано") seg.sold.push(d);
      else if (d.status==="Вiльно") seg.free.push(d);
      else seg.nd.push(d);
    });
    const sum = arr => arr.reduce((a,d)=>a+M(d),0);
    const s = {sold:sum(seg.sold), free:sum(seg.free), nd:sum(seg.nd)};
    return {...g, seg, s, total: s.sold+s.free+s.nd};
  });
  const SEGCOLORS = {sold:SCOLORS["Продано"], free:SCOLORS["Вiльно"], nd:SCOLORS["Не доступно"]};
  return (
    <div>
      {rows.map((r,i) => {
        if (!r.items.length) return (
          <div key={i} style={{display:"flex", alignItems:"center", height:34}}>
            <div style={{width:150, fontSize:12.5, color:"#444", flexShrink:0, paddingRight:10}}>{r.label}</div>
            <div style={{flex:1, fontSize:12, color:"#3a3a4a"}}>—</div>
          </div>
        );
        const pctSold = r.total ? Math.round(r.s.sold/r.total*100) : 0;
        return (
          <div key={i} className="bprow" style={{display:"flex", alignItems:"center", height:34, borderRadius:8, padding:"0 6px", margin:"0 -6px", cursor:"default"}}
            onMouseEnter={e=>setTip({x:e.clientX, y:e.clientY, content:<SellTipBody row={r} />})}
            onMouseMove={e=>setTip({x:e.clientX, y:e.clientY, content:<SellTipBody row={r} />})}
            onMouseLeave={()=>setTip(null)}>
            <div style={{width:150, fontSize:12.5, color:"#999", flexShrink:0, paddingRight:10, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}
                 title={r.label}>{r.label} <span style={{color:"#555", fontSize:11}}>({r.items.length})</span></div>
            <div style={{flex:1, display:"flex", height:16, borderRadius:5, overflow:"hidden", background:"rgba(255,255,255,0.04)"}}>
              {["sold","free","nd"].map(k => r.s[k] > 0 && (
                <div key={k} style={{width:(r.s[k]/r.total*100)+"%", background:SEGCOLORS[k], opacity:k==="nd"?0.45:0.85}} />
              ))}
            </div>
            <div style={{width:120, fontSize:11.5, color:SCOLORS["Продано"], textAlign:"right", flexShrink:0, fontVariantNumeric:"tabular-nums", fontWeight:600}}>
              {pctSold}% прод.
            </div>
          </div>
        );
      })}
      <HoverPop tip={tip} />
    </div>
  );
}

/* ============================== CHESSBOARD ============================== */
function ChessBoard({building, metric}) {
  const [tip, setTip] = useState(null);
  const items = RAW.filter(d => d.building === building);
  const floors = [...new Set(items.map(d=>d.floor))].sort((a,b)=>b-a);
  const posEntr = {};
  items.forEach(d => { posEntr[d.position] = d.entrance; });
  const positions = [...new Set(items.map(d=>d.position))].sort((a,b)=>a-b);
  const byKey = {};
  items.forEach(d => { byKey[d.floor + "_" + d.position] = d; });
  const vals = items.map(d=>d[metric]).filter(v=>v!=null && !Number.isNaN(v));
  const vmin = Math.min(...vals), vmax = Math.max(...vals);
  const CW = 66, CH = 56, GAP = 4, EGAP = 16;

  const entrGroups = [];
  positions.forEach(p => {
    const e = posEntr[p];
    const last = entrGroups[entrGroups.length-1];
    if (last && last.entrance === e) last.positions.push(p);
    else entrGroups.push({entrance:e, positions:[p]});
  });

  const cellVal = d => metric==="priceM2" ? fmtM(d.priceM2) : fmtK(d.totalPrice);

  return (
    <div style={{...CARD, marginBottom:22}}>
      <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:14}}>
        <span style={{width:10, height:10, borderRadius:5, background:BCOLORS[building]}} />
        <span style={{fontSize:15, fontWeight:700}}>{BLABEL[building]}</span>
        <span style={{fontSize:12, color:"#555"}}>{items.length} квартир · {entrGroups.length} під'їзд(и)</span>
      </div>
      <div style={{overflowX:"auto", paddingBottom:6}}>
        <div style={{minWidth:"fit-content"}}>
          {/* entrance header */}
          <div style={{display:"flex", marginLeft:40, marginBottom:8}}>
            {entrGroups.map((g,gi) => (
              <div key={gi} style={{
                width: g.positions.length*CW + (g.positions.length-1)*GAP,
                marginLeft: gi===0?0:EGAP, textAlign:"center", fontSize:11, fontWeight:700,
                letterSpacing:1, textTransform:"uppercase", color:"#777",
                borderBottom:"1px solid rgba(255,255,255,0.08)", paddingBottom:5
              }}>Під'їзд {g.entrance}</div>
            ))}
          </div>
          {/* rows */}
          {floors.map(f => (
            <div key={f} style={{display:"flex", alignItems:"center", marginBottom:GAP}}>
              <div style={{width:40, fontSize:11.5, color:"#666", fontWeight:600, flexShrink:0}}>{f} пов</div>
              {entrGroups.map((g,gi) => (
                <div key={gi} style={{display:"flex", gap:GAP, marginLeft: gi===0?0:EGAP}}>
                  {g.positions.map(p => {
                    const d = byKey[f + "_" + p];
                    if (!d) return <div key={p} style={{width:CW, height:CH, borderRadius:7, background:"rgba(255,255,255,0.015)", border:"1px dashed rgba(255,255,255,0.04)"}} />;
                    const sold = d.status === "Продано";
                    const nd = d.status === "Не доступно";
                    const v = d[metric];
                    const bg = nd ? "rgba(148,163,184,0.10)" : heatColor(v, vmin, vmax);
                    return (
                      <div key={p} className="cbcell"
                        onMouseEnter={e=>setTip({x:e.clientX, y:e.clientY, content:<UnitTipBody d={d} />})}
                        onMouseMove={e=>setTip({x:e.clientX, y:e.clientY, content:<UnitTipBody d={d} />})}
                        onMouseLeave={()=>setTip(null)}
                        style={{
                          width:CW, height:CH, borderRadius:7, background:bg, position:"relative",
                          opacity: sold ? 0.5 : 1, overflow:"hidden",
                          border: sold ? "1.5px solid rgba(249,115,22,0.7)" : "1px solid rgba(0,0,0,0.25)",
                          display:"flex", flexDirection:"column", justifyContent:"space-between",
                          padding:"4px 5px", cursor:"default", color: nd ? "#94a3b8" : "#0f0f1a"
                        }}>
                        <div style={{fontSize:9.5, fontWeight:600, opacity:0.75, display:"flex", justifyContent:"space-between"}}>
                          <span>№{d.number}</span>{sold && <span style={{fontSize:8.5, fontWeight:700, color:"#7c2d12"}}>ПРОД</span>}
                        </div>

                        <div style={{fontSize:9, fontWeight:500, opacity:0.75, textAlign:"center"}}>{d.rooms}к · {fmtA(d.area)}м²</div>
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          ))}
          {/* legend */}
          <div style={{display:"flex", alignItems:"center", gap:12, marginTop:14, marginLeft:40}}>
            <span style={{fontSize:11, color:"#666", fontVariantNumeric:"tabular-nums"}}>{metric==="priceM2"?fmtM(vmin):fmtK(vmin)}</span>
            <div style={{flex:"0 0 220px", height:10, borderRadius:5, background:"linear-gradient(90deg,#3b82f6,#fbbf24,#ef4444)"}} />
            <span style={{fontSize:11, color:"#666", fontVariantNumeric:"tabular-nums"}}>{metric==="priceM2"?fmtM(vmax):fmtK(vmax)}</span>

          </div>
        </div>
      </div>
      <HoverPop tip={tip} />
    </div>
  );
}

/* ============================== DASHBOARD ============================== */
function Dashboard() {
  const [activeB, setActiveB] = useState(new Set(BUILDINGS));
  const [activeS, setActiveS] = useState(new Set(["Вiльно","Продано"]));
  const [activeR, setActiveR] = useState(new Set(ROOMS));
  const [metric, setMetric] = useState("priceM2");
  const [floorTab, setFloorTab] = useState("scatter");
  const [stMode, setStMode] = useState("count");

  const toggle = (set, setter, val) => {
    const next = new Set(set);
    if (next.has(val)) { if (next.size > 1) next.delete(val); }
    else next.add(val);
    setter(next);
  };

  const metricLabel = metric === "priceM2" ? "$/м²" : "Вартість, $";
  const vFmt = metric === "priceM2" ? fmtM : fmtM;
  const pad = metric === "priceM2" ? 50 : 2500;

  const filtered = useMemo(() =>
    RAW.filter(d =>
      activeB.has(d.building) && activeS.has(d.status) && activeR.has(d.rooms) &&
      d[metric] != null && !Number.isNaN(d[metric])
    ), [activeB, activeS, activeR, metric]);

  const activeBList = BUILDINGS.filter(b => activeB.has(b));

  /* ---- header stats ---- */
  const hstats = useMemo(() => {
    const vals = filtered.map(d => d[metric]);
    const s = calcStats(vals);
    const totalArea = filtered.reduce((a,d)=>a+(d.area||0),0);
    const totalValue = filtered.reduce((a,d)=>a+(d.totalPrice||0),0);
    const free = filtered.filter(d=>d.status==="Вiльно").length;
    const sold = filtered.filter(d=>d.status==="Продано").length;
    return {...s, wavg: totalArea? totalValue/totalArea : null, totalValue, totalArea, free, sold};
  }, [filtered, metric]);

  /* ---- 01 scatter/bar ---- */
  const yDomain = useMemo(() => {
    if (!filtered.length) return [0, 100];
    const vals = filtered.map(d=>d[metric]);
    return [Math.floor((Math.min(...vals)-pad)/10)*10, Math.ceil((Math.max(...vals)+pad)/10)*10];
  }, [filtered, metric]);

  const barData = useMemo(() => FLOORS.map(f => {
    const row = {floor: f};
    activeBList.forEach(b => {
      const s = calcStats(filtered.filter(d=>d.building===b && d.floor===f).map(d=>d[metric]));
      if (s.count) row[b] = Math.round(s.mean);
    });
    return row;
  }), [filtered, metric, activeB]);

  /* ---- 02 gaussian + histogram ---- */
  const gauss = useMemo(() => {
    const vals = filtered.map(d=>d[metric]);
    if (vals.length < 3) return {points:[], statsAll:calcStats([]), byB:{}};
    const statsAll = calcStats(vals);
    const byB = {};
    activeBList.forEach(b => {
      const s = calcStats(filtered.filter(d=>d.building===b).map(d=>d[metric]));
      if (s.count >= 3) byB[b] = s;
    });
    const lo = statsAll.min - pad, hi = statsAll.max + pad;
    const points = [];
    for (let i=0; i<=80; i++) {
      const x = lo + (hi-lo)*i/80;
      const obj = {x: Math.round(x), all: gaussianPDF(x, statsAll.mean, statsAll.std)};
      Object.keys(byB).forEach(b => { obj[b] = gaussianPDF(x, byB[b].mean, byB[b].std); });
      points.push(obj);
    }
    return {points, statsAll, byB};
  }, [filtered, metric, activeB]);

  const hist = useMemo(() => {
    const vals = filtered.map(d=>d[metric]).sort((a,b)=>a-b);
    if (vals.length < 5) return [];
    const min = vals[0], max = vals[vals.length-1];
    const NB = 10, w = (max-min)/NB || 1;
    const bins = Array.from({length:NB}, (_,i)=>({i, lo:min+i*w, hi:min+(i+1)*w, count:0}));
    vals.forEach(v => { let k = Math.min(Math.floor((v-min)/w), NB-1); bins[k].count++; });
    return bins.map(b => ({
      bin: "B"+(b.i+1), count: b.count, pct: Math.round(b.count/vals.length*100),
      range: (metric==="priceM2" ? `$${fmt(b.lo)}–${fmt(b.hi)}` : `${fmtK(b.lo)}–${fmtK(b.hi)}`),
      color: heatColor((b.lo+b.hi)/2, min, max)
    }));
  }, [filtered, metric]);

  /* ---- 03 box-plot slices ---- */
  const mkGroups = (labels, fn) => labels.map(l => ({label: l.label, stats: calcStats(filtered.filter(d=>fn(d,l)).map(d=>d[metric])), key:l.key}));
  const byBuilding = useMemo(() => {
    const g = activeBList.map(b => ({label: BLABEL[b], key: b, stats: calcStats(filtered.filter(d=>d.building===b).map(d=>d[metric]))}));
    return g.sort((a,b)=>(b.stats.median??-1)-(a.stats.median??-1));
  }, [filtered, metric, activeB]);
  const byRooms = useMemo(() => {
    const g = ROOMS.filter(r=>activeR.has(r)).map(r => ({label: r+"-кімнатні", key:r, stats: calcStats(filtered.filter(d=>d.rooms===r).map(d=>d[metric]))}));
    return g.sort((a,b)=>(b.stats.median??-1)-(a.stats.median??-1));
  }, [filtered, metric, activeR]);
  const byView = useMemo(() => {
    const views = [...new Set(filtered.map(d=>d.view))];
    const g = views.map(v => ({label: v, key:v, stats: calcStats(filtered.filter(d=>d.view===v).map(d=>d[metric]))}));
    return g.sort((a,b)=>(b.stats.median??-1)-(a.stats.median??-1));
  }, [filtered, metric]);
  const byLayout = useMemo(() => {
    const present = LAYOUT_ORDER.filter(l => filtered.some(d=>d.layout===l));
    return present.slice().reverse().map(l => ({label: l, key:l, stats: calcStats(filtered.filter(d=>d.layout===l).map(d=>d[metric]))}));
  }, [filtered, metric]);
  const byFloor = useMemo(() =>
    FLOORS.slice().reverse().map(f => ({label: "Поверх "+f, key:f, stats: calcStats(filtered.filter(d=>d.floor===f).map(d=>d[metric]))}))
  , [filtered, metric]);
  const byEntrance = useMemo(() => {
    const keys = [...new Set(filtered.map(d=>d.building+" · П"+d.entrance))].sort();
    const g = keys.map(k => ({label: k, key:k, stats: calcStats(filtered.filter(d=>(d.building+" · П"+d.entrance)===k).map(d=>d[metric]))}));
    return g.sort((a,b)=>(b.stats.median??-1)-(a.stats.median??-1));
  }, [filtered, metric]);

  /* ---- 04 sell-through (статус-фільтр не застосовується — показуємо весь склад) ---- */
  const stBase = useMemo(() => RAW.filter(d => activeB.has(d.building) && activeR.has(d.rooms)), [activeB, activeR]);
  const soldShare = items => { const t = items.length; return t ? items.filter(d=>d.status==="Продано").length/t : -1; };
  const stByBuilding = useMemo(() =>
    activeBList.map(b => ({label: BLABEL[b], items: stBase.filter(d=>d.building===b)}))
      .sort((a,b)=>soldShare(b.items)-soldShare(a.items))
  , [stBase, activeB]);
  const stByRooms = useMemo(() =>
    ROOMS.filter(r=>activeR.has(r)).map(r => ({label: r+"-кімнатні", items: stBase.filter(d=>d.rooms===r)}))
      .sort((a,b)=>soldShare(b.items)-soldShare(a.items))
  , [stBase, activeR]);
  const stByView = useMemo(() =>
    [...new Set(stBase.map(d=>d.view))].map(v => ({label: v, items: stBase.filter(d=>d.view===v)}))
      .sort((a,b)=>soldShare(b.items)-soldShare(a.items))
  , [stBase]);
  const stByEntrance = useMemo(() =>
    [...new Set(stBase.map(d=>d.building+" · П"+d.entrance))].sort()
      .map(k => ({label: k, items: stBase.filter(d=>(d.building+" · П"+d.entrance)===k)}))
      .sort((a,b)=>soldShare(b.items)-soldShare(a.items))
  , [stBase]);
  const stByLayout = useMemo(() =>
    LAYOUT_ORDER.filter(l => stBase.some(d=>d.layout===l)).slice().reverse()
      .map(l => ({label: l, items: stBase.filter(d=>d.layout===l)}))
  , [stBase]);
  const stByFloor = useMemo(() =>
    FLOORS.slice().reverse().map(f => ({label: "Поверх "+f, items: stBase.filter(d=>d.floor===f)}))
  , [stBase]);
  const stTotals = useMemo(() => {
    const sold = stBase.filter(d=>d.status==="Продано");
    const free = stBase.filter(d=>d.status==="Вiльно");
    return {
      n: stBase.length, soldN: sold.length, freeN: free.length,
      soldPct: stBase.length ? Math.round(sold.length/stBase.length*100) : 0,
      soldVal: sold.reduce((a,d)=>a+(d.totalPrice||0),0),
      freeVal: free.reduce((a,d)=>a+(d.totalPrice||0),0)
    };
  }, [stBase]);

  /* ---- 05 table ---- */
  const tableRows = useMemo(() =>
    RAW.filter(d => activeB.has(d.building) && activeS.has(d.status) && activeR.has(d.rooms))
       .slice().sort((a,b)=> a.building===b.building ? a.number-b.number : BUILDINGS.indexOf(a.building)-BUILDINGS.indexOf(b.building))
  , [activeB, activeS, activeR]);

  const scatterShape = (props) => {
    const {cx, cy, fill, payload} = props;
    if (cx==null || cy==null) return null;
    const sold = payload.status === "Продано";
    return <circle cx={cx} cy={cy} r={4.5} fill={fill} fillOpacity={sold?0.85:0.5}
                   stroke={sold ? "#f97316" : fill} strokeWidth={sold?1.6:0.8} strokeOpacity={sold?1:0.9} />;
  };

  const activeColHL = {color:GOLD, fontWeight:700};

  return (
    <div style={{fontFamily:"'DM Sans','Segoe UI',system-ui,sans-serif", background:"#0f0f1a", color:"#e2e8f0", minHeight:"100vh", padding:"28px 24px"}}>
      <style>{`*{box-sizing:border-box;margin:0;padding:0}
        .fbtn{border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;display:flex;align-items:center;gap:7px;background:transparent}
        .fbtn:hover{border-color:rgba(255,255,255,0.25)}
        .tbtn{border:none;background:transparent;color:#666;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;border-radius:8px;transition:all .2s;font-family:inherit}
        .tbtn.on{background:rgba(255,255,255,0.08);color:#e2e8f0}
        .tbtn:hover:not(.on){color:#aaa}
        .cbcell{transition:transform .12s}
        .cbcell:hover{transform:scale(1.06);z-index:3}
        .bprow{transition:background .15s}
        .bprow:hover{background:rgba(255,255,255,0.045)}
        .recharts-cartesian-grid line{stroke:rgba(255,255,255,0.04)!important}
        table.dt{border-collapse:collapse;width:100%;font-size:12.5px}
        table.dt th{position:sticky;top:0;background:#16162a;color:#888;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:9px 10px;text-align:right;border-bottom:1px solid rgba(255,255,255,0.1);z-index:5;white-space:nowrap}
        table.dt th:first-child,table.dt td:first-child{text-align:left}
        table.dt td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,0.04);text-align:right;font-variant-numeric:tabular-nums;color:#ccc;white-space:nowrap}
        .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}`}</style>

      {/* HEADER */}
      <div style={{marginBottom:24}}>
        <div style={{fontSize:11, letterSpacing:2, textTransform:"uppercase", color:"#666", fontWeight:600, marginBottom:6}}>Порівняльна цінова аналітика · Maxify Price Analytics</div>
        <h1 style={{fontSize:28, fontWeight:700, letterSpacing:-0.5, margin:0}}>
          Садова Алея <span style={{color:BCOLORS["Б5"]}}>5</span> · <span style={{color:BCOLORS["Б7.1"]}}>7.1</span> · <span style={{color:BCOLORS["Б7.2"]}}>7.2</span> · <span style={{color:BCOLORS["Б8"]}}>8</span> · <span style={{color:BCOLORS["Б8-NEW"]}}>8-NEW</span> · <span style={{color:BCOLORS["Б9"]}}>9</span>
        </h1>
        <div style={{fontSize:13, color:"#555", marginTop:6}}>{RAW.length} записів · 5 будинків + прайс-версія 8-NEW · до 8 поверхів · 1–3 кімнати · USD</div>

            {ROOMS.map(r => (
              <FilterBtn key={r} active={activeR.has(r)} color="#e2e8f0" bg="rgba(255,255,255,0.08)" onClick={()=>toggle(activeR,setActiveR,r)}>

              </FilterBtn>

      {/* STAT CARDS */}

        <StatCard label={metric==="priceM2" ? "Сер. зважена $/м²" : "Сер. вартість"} color={GOLD}
          value={metric==="priceM2" ? fmtM(hstats.wavg) : fmtM(hstats.mean)}
          sub={metric==="priceM2" ? `проста сер. ${fmtM(hstats.mean)}` : `зваж. $/м² ${fmtM(hstats.wavg)}`} />
        <StatCard label="Медіана" value={fmtM(hstats.median)} sub={metricLabel} />
        <StatCard label="Діапазон" value={`${fmtM(hstats.min)} – ${fmtM(hstats.max)}`} sub={metricLabel} />
        <StatCard label="Обсяг вибірки" value={fmtM(hstats.totalValue)} sub={`${fmtA(hstats.totalArea)} м² загалом`} />
      </div>

      {/* 01 — PRICES BY FLOOR */}
      <SectionTitle num="01" title="Ціни по поверхах" sub={`Кожна точка — квартира (${metricLabel}); обводка помаранчева — продано. Bar chart — середні по поверхах.`} />
      <div style={{...CARD}}>
        <div style={{marginBottom:14}}>
          <Seg items={[{v:"scatter",l:"Scatter"},{v:"bar",l:"Середні (Bar)"}]} value={floorTab} onChange={setFloorTab} />
        </div>
        <div style={{width:"100%", height:420}}>
          {floorTab === "scatter" ? (
            <ResponsiveContainer>
              <ScatterChart margin={{top:10,right:20,bottom:10,left:10}}>
                <CartesianGrid />
                <XAxis type="number" dataKey="floor" name="Поверх" domain={[0.5, 8.5]} ticks={FLOORS}
                       tick={{fill:"#666", fontSize:12}} label={{value:"Поверх", position:"insideBottom", offset:-6, fill:"#555", fontSize:12}} />
                <YAxis type="number" dataKey={metric} domain={yDomain} tick={{fill:"#666", fontSize:12}}
                       tickFormatter={v=>metric==="priceM2"?fmt(v):fmtK(v)} width={64} />
                <Tooltip content={<ScatterTip />} cursor={{strokeDasharray:"3 3", stroke:"rgba(255,255,255,0.15)"}} />
                {activeBList.map(b => (
                  <Scatter key={b} name={b} data={filtered.filter(d=>d.building===b)} fill={BCOLORS[b]} shape={scatterShape} isAnimationActive={false} />
                ))}
              </ScatterChart>
            </ResponsiveContainer>
          ) : (
            <ResponsiveContainer>
              <BarChart data={barData} margin={{top:10,right:20,bottom:10,left:10}}>
                <CartesianGrid vertical={false} />
                <XAxis dataKey="floor" tick={{fill:"#666", fontSize:12}} label={{value:"Поверх", position:"insideBottom", offset:-6, fill:"#555", fontSize:12}} />
                <YAxis domain={["auto","auto"]} tick={{fill:"#666", fontSize:12}} tickFormatter={v=>metric==="priceM2"?fmt(v):fmtK(v)} width={64} />
                <Tooltip content={<BarTip metric={metric} />} cursor={{fill:"rgba(255,255,255,0.03)"}} />
                {activeBList.map(b => (
                  <Bar key={b} dataKey={b} fill={BCOLORS[b]} maxBarSize={activeBList.length<=2?40:activeBList.length<=4?24:20} radius={[3,3,0,0]} isAnimationActive={false} />
                ))}
              </BarChart>
            </ResponsiveContainer>
          )}
        </div>
        <div style={{display:"flex", gap:16, marginTop:10, flexWrap:"wrap"}}>
          {activeBList.map(b => (
            <span key={b} style={{fontSize:12, color:"#888"}}><span style={{display:"inline-block",width:10,height:10,borderRadius:5,background:BCOLORS[b],verticalAlign:"middle",marginRight:6}} />{BLABEL[b]}</span>
          ))}
          {floorTab==="scatter" && <span style={{fontSize:12, color:"#666"}}><span style={{display:"inline-block",width:10,height:10,borderRadius:5,border:"1.5px solid #f97316",verticalAlign:"middle",marginRight:6}} />Продано</span>}
        </div>
      </div>

      {/* 02 — DISTRIBUTION */}
      <SectionTitle num="02" title="Нормальний розподіл" sub={`Криві Гауса за обраною метрикою (${metricLabel}) — загальна та по будинках, μ ± σ.`} />
      <div style={{display:"grid", gridTemplateColumns:"1fr", gap:18}}>
        <div style={{...CARD}}>
          <div style={{width:"100%", height:320}}>
            <ResponsiveContainer>
              <ComposedChart data={gauss.points} margin={{top:10,right:20,bottom:6,left:10}}>
                <CartesianGrid />
                <XAxis dataKey="x" type="number" domain={["dataMin","dataMax"]} tick={{fill:"#666", fontSize:12}}
                       tickFormatter={v=>metric==="priceM2"?fmt(v):fmtK(v)} />
                <YAxis hide />
                <Tooltip content={<GaussTip />} />
                <Area type="monotone" dataKey="all" stroke={GOLD} strokeWidth={2} fill={GOLD} fillOpacity={0.06} isAnimationActive={false} />
                {Object.keys(gauss.byB).map(b => (
                  <Line key={b} type="monotone" dataKey={b} stroke={BCOLORS[b]} strokeWidth={1.6} strokeDasharray="5 4" dot={false} isAnimationActive={false} />
                ))}
                {gauss.statsAll.mean != null &&
                  <ReferenceLine x={Math.round(gauss.statsAll.mean)} stroke="rgba(255,255,255,0.35)" strokeDasharray="4 4"
                    label={{value:"μ "+(metric==="priceM2"?fmtM(gauss.statsAll.mean):fmtK(gauss.statsAll.mean)), fill:"#aaa", fontSize:11, position:"top"}} />}
              </ComposedChart>
            </ResponsiveContainer>
          </div>
          <div style={{display:"flex", gap:20, marginTop:10, flexWrap:"wrap"}}>
            <span style={{fontSize:12, color:"#888"}}><span style={{display:"inline-block",width:12,height:3,background:GOLD,verticalAlign:"middle",marginRight:6}} />Всі обрані: μ {fmtM(gauss.statsAll.mean)} · σ {fmt(gauss.statsAll.std)}</span>
            {Object.keys(gauss.byB).map(b => (
              <span key={b} style={{fontSize:12, color:"#888"}}><span style={{display:"inline-block",width:12,height:3,background:BCOLORS[b],verticalAlign:"middle",marginRight:6}} />{b}: μ {fmtM(gauss.byB[b].mean)} · σ {fmt(gauss.byB[b].std)}</span>
            ))}
          </div>
        </div>
        <div style={{...CARD}}>
          <div style={{fontSize:13, fontWeight:700, color:"#aaa", marginBottom:10}}>Гістограма розподілу (10 рівних інтервалів)</div>
          <div style={{width:"100%", height:240}}>
            <ResponsiveContainer>
              <BarChart data={hist} margin={{top:16,right:10,bottom:4,left:10}}>
                <CartesianGrid vertical={false} />
                <XAxis dataKey="range" tick={{fill:"#666", fontSize:9.5}} interval={0} angle={-14} height={44} textAnchor="end" />
                <YAxis tick={{fill:"#666", fontSize:11}} allowDecimals={false} width={34} />
                <Tooltip content={<HistTip />} cursor={{fill:"rgba(255,255,255,0.03)"}} />
                <Bar dataKey="count" radius={[3,3,0,0]} isAnimationActive={false}
                     label={{position:"top", fill:"#777", fontSize:10, formatter:(v)=>v||""}}>
                  {hist.map((h,i)=>(<Cell key={i} fill={h.color} fillOpacity={0.85} />))}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
      </div>

      {/* 03 — BOX PLOTS */}
      <SectionTitle num="03" title="Порівняння діапазонів (box-plot)" sub={`Мін–макс, міжквартильний розмах, медіана та середня за метрикою ${metricLabel}.`} />
      <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(480px, 1fr))", gap:18}}>
        <div style={{...CARD}}>
          <div style={{fontSize:13, fontWeight:700, color:"#aaa", marginBottom:12}}>За будинком</div>
          <RangeChart groups={byBuilding} colorFn={g=>BCOLORS[g.key]||GOLD} valueFmt={vFmt} />
        </div>
        <div style={{...CARD}}>
          <div style={{fontSize:13, fontWeight:700, color:"#aaa", marginBottom:12}}>За кімнатністю</div>
          <RangeChart groups={byRooms} valueFmt={vFmt} />

          <div style={{fontSize:13, fontWeight:700, color:"#aaa", marginBottom:12}}>За поверхом <span style={{color:"#555", fontWeight:400}}>(поверх 1 внизу)</span></div>
          <RangeChart groups={byFloor} valueFmt={vFmt} />
        </div>
      </div>

      {/* 04 — SELL-THROUGH */}
      <SectionTitle num="04" title="Розпроданість" sub="Структура Продано / Вільно / Не доступно по параметрах. Враховуються фільтри «Будинок» і «Кімнатність»; фільтр статусу тут не застосовується — показано весь склад." />
      <div style={{display:"flex", gap:12, marginBottom:14, flexWrap:"wrap", alignItems:"center"}}>
        <Seg items={[{v:"count",l:"Кількість, шт"},{v:"area",l:"Площа, м²"},{v:"value",l:"Вартість, $"}]} value={stMode} onChange={setStMode} />
        <div style={{fontSize:12.5, color:"#666"}}>
          Всього <b style={{color:"#ccc"}}>{stTotals.n}</b> кв · Продано <b style={{color:SCOLORS["Продано"]}}>{stTotals.soldN}</b> ({stTotals.soldPct}%) на <b style={{color:SCOLORS["Продано"]}}>{fmtM(stTotals.soldVal)}</b> · Залишок вільних <b style={{color:SCOLORS["Вiльно"]}}>{stTotals.freeN}</b> на <b style={{color:GOLD}}>{fmtM(stTotals.freeVal)}</b>
          {stMode==="value" && <span style={{color:"#555"}}> · «Не доступно» без ціни у режимі $ не враховуються</span>}
        </div>
      </div>
      <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(480px, 1fr))", gap:18}}>
        <div style={{...CARD}}>
          <div style={{fontSize:13, fontWeight:700, color:"#aaa", marginBottom:12}}>За будинком</div>
          <SellThrough groups={stByBuilding} mode={stMode} />
        </div>
        <div style={{...CARD}}>

          <SellThrough groups={stByRooms} mode={stMode} />
        </div>
        <div style={{...CARD}}>
          <div style={{fontSize:13, fontWeight:700, color:"#aaa", marginBottom:12}}>За видом з вікна</div>
          <SellThrough groups={stByView} mode={stMode} />
        </div>
        <div style={{...CARD}}>
          <div style={{fontSize:13, fontWeight:700, color:"#aaa", marginBottom:12}}>За під'їздом</div>
          <SellThrough groups={stByEntrance} mode={stMode} />
        </div>
        <div style={{...CARD}}>
          <div style={{fontSize:13, fontWeight:700, color:"#aaa", marginBottom:12}}>За типом планування <span style={{color:"#555", fontWeight:400}}>(1A внизу → 3A вгорі)</span></div>
          <SellThrough groups={stByLayout} mode={stMode} />
        </div>
        <div style={{...CARD}}>
          <div style={{fontSize:13, fontWeight:700, color:"#aaa", marginBottom:12}}>За поверхом <span style={{color:"#555", fontWeight:400}}>(поверх 1 внизу)</span></div>
          <SellThrough groups={stByFloor} mode={stMode} />
        </div>
      </div>
      <div style={{display:"flex", gap:18, marginTop:12, fontSize:11, color:"#555", flexWrap:"wrap"}}>
        <span><span style={{display:"inline-block",width:14,height:8,background:SCOLORS["Продано"],opacity:0.85,borderRadius:2,verticalAlign:"middle",marginRight:5}} />Продано</span>
        <span><span style={{display:"inline-block",width:14,height:8,background:SCOLORS["Вiльно"],opacity:0.85,borderRadius:2,verticalAlign:"middle",marginRight:5}} />Вільно</span>
        <span><span style={{display:"inline-block",width:14,height:8,background:SCOLORS["Не доступно"],opacity:0.45,borderRadius:2,verticalAlign:"middle",marginRight:5}} />Не доступно</span>
      </div>

      {/* 05 — TABLE */}
      <SectionTitle num="05" title="Таблиця даних" sub={`${tableRows.length} квартир за обраними фільтрами. Активна метрика підсвічена золотим.`} />
      <div style={{...CARD, padding:0, overflow:"hidden"}}>
        <div style={{maxHeight:480, overflow:"auto"}}>
          <table className="dt">
            <thead>
              <tr>
                <th>Будинок</th><th>№</th><th>Під'їзд</th><th>Поверх</th><th>Кімнат</th><th>План.</th><th>Вид</th><th>Площа, м²</th>
                <th style={metric==="priceM2"?activeColHL:{}}>$/м²</th>
                <th style={metric==="totalPrice"?activeColHL:{}}>Вартість, $</th>
                <th>Статус</th>
              </tr>
            </thead>
            <tbody>
              {tableRows.map((d,i) => (
                <tr key={i}>
                  <td><span className="badge" style={{background:BBG[d.building], color:BCOLORS[d.building]}}>{d.building}</span></td>
                  <td>{d.number}</td>
                  <td>{d.entrance}</td>
                  <td>{d.floor}</td>
                  <td>{d.rooms}</td>
                  <td>{d.layout}</td>
                  <td style={{textAlign:"left", color:"#999"}}>{d.view}</td>
                  <td>{fmtA(d.area)}</td>
                  <td style={metric==="priceM2"?activeColHL:{}}>{fmt(d.priceM2)}</td>
                  <td style={metric==="totalPrice"?activeColHL:{}}>{fmt(d.totalPrice)}</td>
                  <td><span className="badge" style={{background:SBG[d.status], color:SCOLORS[d.status]}}>{d.status==="Вiльно"?"Вільно":d.status}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* 06 — CHESSBOARD */}
      <SectionTitle num="06" title="Шахматка (heatmap)" sub={`Поверхи знизу вгору, колонки — позиція на поверсі з розбивкою по під'їздах. Heatmap за метрикою ${metricLabel}: синій = мін, жовтий = середина, червоний = макс (шкала окремо для кожного будинку). Продані — фактична ціна угоди.`} />
      {activeBList.map(b => <ChessBoard key={b} building={b} metric={metric} />)}

      <div style={{marginTop:30, paddingTop:16, borderTop:"1px solid rgba(255,255,255,0.05)", fontSize:11.5, color:"#444", display:"flex", justifyContent:"space-between", flexWrap:"wrap", gap:8}}>
        <span>Садова Алея · Будинки 5 / 7.1 / 7.2 / 8 (+прайс 8-NEW) / 9 · Цінова аналітика</span>
        <span>Maxify Price Analytics · {new Date().toLocaleDateString("uk-UA")}</span>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Dashboard />);
</script>

<div id="login" style="position:fixed;inset:0;background:#0f0f1a;display:flex;align-items:center;justify-content:center;z-index:2000;font-family:'DM Sans','Segoe UI',system-ui,sans-serif">
  <div style="width:340px;padding:36px 32px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:18px;text-align:center">
    <div style="font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#666;font-weight:600;margin-bottom:10px">Maxify Price Analytics</div>
    <div style="font-size:24px;font-weight:700;color:#e2e8f0;margin-bottom:4px">Садова Алея</div>
    <div style="font-size:12.5px;color:#555;margin-bottom:26px">Будинки 5 · 7.1 · 7.2 · 8 · 9</div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input id="pw" type="password" placeholder="Пароль" autocomplete="off"
        style="flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:11px 14px;color:#e2e8f0;font-size:14px;font-family:inherit;outline:none" />
      <button id="pw-toggle" title="Показати/сховати пароль"
        style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:0 13px;color:#888;font-size:15px;cursor:pointer;font-family:inherit">&#128065;</button>
    </div>
    <button id="pw-submit"
      style="width:100%;background:#fbbf24;border:none;border-radius:10px;padding:12px;color:#0f0f1a;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Увійти</button>
    <div id="pw-err" style="height:18px;margin-top:12px;font-size:12.5px;color:#f87171"></div>
  </div>
</div>

<script>
(function(){
  function djb2(s){var h=5381;for(var i=0;i<s.length;i++){h=(((h<<5)+h)+s.charCodeAt(i))>>>0;}return h.toString(16);}
  var HASH = "ee03a2ed";
  var launched = false;
  function launch(){
    if (launched) return; launched = true;
    var lg = document.getElementById('login'); if (lg) lg.style.display = 'none';
    var src = document.getElementById('app-source').textContent;
    var out = Babel.transform(src, {presets:[['react',{runtime:'classic'}]]}).code;
    (new Function(out))();
  }
  function attempt(){
    var v = document.getElementById('pw').value;
    if (djb2(v) === HASH) {
      try { sessionStorage.setItem('sa59_auth','1'); } catch(e){}
      launch();
    } else {
      document.getElementById('pw-err').textContent = 'Невірний пароль';
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
    }
  }
  document.getElementById('pw-submit').addEventListener('click', attempt);
  document.getElementById('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') attempt(); });
  document.getElementById('pw').addEventListener('input', function(){ document.getElementById('pw-err').textContent = ''; });
  document.getElementById('pw-toggle').addEventListener('click', function(){
    var p = document.getElementById('pw');
    p.type = p.type === 'password' ? 'text' : 'password';
    this.style.color = p.type === 'text' ? '#fbbf24' : '#888';
    p.focus();
  });
  try { if (sessionStorage.getItem('sa59_auth') === '1') { launch(); return; } } catch(e){}
  document.getElementById('pw').focus();
})();
</script>
</body>
</html>
