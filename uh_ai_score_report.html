<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Захищений документ</title>
<style>
:root{--navy:#1B2A4A;--teal:#00897B;--muted:#6B7385;--red:#C0504D;--border:#E3E6EC}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Calibri,'Segoe UI',Arial,sans-serif;background:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lock{background:#fff;border-radius:12px;padding:38px 40px;max-width:430px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35);text-align:center}
.badge{width:52px;height:52px;border-radius:50%;background:#EAF3F2;color:var(--teal);font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
h1{font-family:Georgia,'Times New Roman',serif;color:var(--navy);font-size:20px;margin-bottom:6px}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:22px;line-height:1.5}
input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-size:15px;font-family:inherit;margin-bottom:12px;outline:none}
input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,137,123,.12)}
button{width:100%;padding:11px;background:var(--teal);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
button:hover{background:#00786C}
button:disabled{background:#9BB8B4;cursor:wait}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div class="lock">
  <div class="badge">&#128274;</div>
  <h1>Захищений документ</h1>
  <div class="sub">Введіть пароль для перегляду.</div>
  <input type="password" id="pw" placeholder="Пароль" autocomplete="off" autofocus>
  <button id="btn" onclick="unlock()">Відкрити звіт</button>
  <div class="err" id="err"></div>
</div>

  if(!pw){ err.textContent = 'Введіть пароль.'; return; }
  btn.disabled = true; btn.textContent = 'Розшифровую…'; err.textContent = '';
